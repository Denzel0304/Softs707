<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sending E-mail</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #00ff41;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 255, 65, 0.03) 2px,
      rgba(0, 255, 65, 0.03) 4px
    );
    pointer-events: none;
    z-index: 0;
  }

  .container {
    width: 100%;
    max-width: 400px;
    position: relative;
    z-index: 1;
  }

  .header {
    text-align: center;
    margin-bottom: 40px;
  }

  .title {
    font-family: 'Orbitron', monospace;
    font-size: 22px;
    font-weight: 700;
    color: #00ff41;
    letter-spacing: 3px;
    text-shadow: 0 0 20px rgba(0, 255, 65, 0.8);
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 11px;
    color: #005c1a;
    letter-spacing: 2px;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 12px 0 32px;
  }

  .divider-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, #00ff41, transparent);
    opacity: 0.4;
  }

  .divider-dot {
    width: 4px;
    height: 4px;
    background: #00ff41;
    border-radius: 50%;
    box-shadow: 0 0 6px #00ff41;
  }

  .card {
    border: 1px solid rgba(0, 255, 65, 0.3);
    border-radius: 4px;
    padding: 28px 24px;
    background: rgba(0, 255, 65, 0.03);
    position: relative;
  }

  .card::before {
    content: '';
    position: absolute;
    top: -1px; left: 20px; right: 20px;
    height: 1px;
    background: linear-gradient(to right, transparent, #00ff41, transparent);
  }

  .corner {
    position: absolute;
    width: 12px;
    height: 12px;
    border-color: #00ff41;
    border-style: solid;
    opacity: 0.8;
  }
  .corner-tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .corner-tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
  .corner-bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
  .corner-br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

  .label {
    font-size: 11px;
    color: #008f24;
    letter-spacing: 2px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .label::before {
    content: '>';
    color: #00ff41;
    font-size: 13px;
  }

  input[type="email"] {
    width: 100%;
    background: rgba(0, 255, 65, 0.05);
    border: 1px solid rgba(0, 255, 65, 0.3);
    border-radius: 3px;
    color: #00ff41;
    font-family: 'Share Tech Mono', monospace;
    font-size: 15px;
    padding: 14px 16px;
    outline: none;
    transition: all 0.2s;
    letter-spacing: 1px;
  }

  input[type="email"]::placeholder {
    color: rgba(0, 255, 65, 0.2);
    font-size: 13px;
  }

  input[type="email"]:focus {
    border-color: #00ff41;
    background: rgba(0, 255, 65, 0.08);
    box-shadow: 0 0 16px rgba(0, 255, 65, 0.2), inset 0 0 8px rgba(0, 255, 65, 0.05);
  }

  .error-msg {
    font-size: 11px;
    color: #ff3131;
    letter-spacing: 1px;
    margin-top: 8px;
    display: none;
  }

  .error-msg.show { display: block; }

  .btn {
    width: 100%;
    margin-top: 24px;
    padding: 16px;
    background: transparent;
    border: 1px solid #00ff41;
    border-radius: 3px;
    color: #00ff41;
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.2s;
  }

  .btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0,255,65,0.15), transparent);
    transition: left 0.4s;
  }

  .btn:hover::before { left: 100%; }
  .btn:hover {
    background: rgba(0, 255, 65, 0.1);
    box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
    text-shadow: 0 0 8px rgba(0, 255, 65, 0.8);
  }

  .btn:active { transform: scale(0.98); }

  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .btn-text { position: relative; z-index: 1; }

  .status-line {
    margin-top: 20px;
    font-size: 11px;
    color: #005c1a;
    letter-spacing: 1px;
    min-height: 16px;
    text-align: center;
  }

  .status-line.active { color: #00ff41; }

  .blink {
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* 모달 */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .modal-overlay.show { display: flex; }

  .modal {
    width: 100%;
    max-width: 320px;
    border: 1px solid rgba(0, 255, 65, 0.5);
    border-radius: 4px;
    background: #000;
    padding: 32px 24px;
    text-align: center;
    position: relative;
    box-shadow: 0 0 40px rgba(0, 255, 65, 0.2);
  }

  .modal .corner { opacity: 1; }

  .modal-icon {
    font-size: 36px;
    margin-bottom: 16px;
    filter: drop-shadow(0 0 10px rgba(0,255,65,0.8));
  }

  .modal-title {
    font-family: 'Orbitron', monospace;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #00ff41;
    margin-bottom: 10px;
    text-shadow: 0 0 10px rgba(0,255,65,0.5);
  }

  .modal-body {
    font-size: 12px;
    color: #008f24;
    letter-spacing: 1px;
    line-height: 1.8;
    margin-bottom: 24px;
    word-break: break-all;
  }

  .modal-body span {
    color: #00ff41;
    display: block;
    margin-top: 4px;
  }

  .modal-btn {
    padding: 12px 32px;
    background: transparent;
    border: 1px solid #00ff41;
    border-radius: 3px;
    color: #00ff41;
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .modal-btn:hover {
    background: rgba(0,255,65,0.1);
    box-shadow: 0 0 12px rgba(0,255,65,0.3);
  }

  .footer {
    margin-top: 32px;
    text-align: center;
    font-size: 10px;
    color: #003d0f;
    letter-spacing: 2px;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="title">SENDING E-MAIL</div>
    <div class="subtitle">SECURE TRANSMISSION SYSTEM</div>
    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-dot"></div>
      <div class="divider-line"></div>
    </div>
  </div>

  <div class="card">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <div class="label">TARGET ADDRESS</div>
    <input type="email" id="emailInput" placeholder="user@domain.com" autocomplete="email" />
    <div class="error-msg" id="errorMsg">// INVALID EMAIL FORMAT</div>

    <button class="btn" id="sendBtn" onclick="sendEmail()">
      <span class="btn-text">TRANSMIT</span>
    </button>

    <div class="status-line" id="statusLine">// AWAITING INPUT<span class="blink">_</span></div>
  </div>

  <div class="footer">[ ENCRYPTED · SECURE · PRIVATE ]</div>
</div>

<!-- 모달 -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
    <div class="modal-icon">✓</div>
    <div class="modal-title">TRANSMISSION COMPLETE</div>
    <div class="modal-body">
      이메일 발송 완료
      <span id="modalEmail"></span>
    </div>
    <button class="modal-btn" onclick="closeModal()">CONFIRM</button>
  </div>
</div>

<script>
const GAS_URL = "여기에_GAS_웹앱_URL_입력";

history.pushState(null, '', location.href);
window.addEventListener('popstate', function() {
  if (document.getElementById('modalOverlay').classList.contains('show')) {
    closeModal();
    history.pushState(null, '', location.href);
  }
});

async function sendEmail() {
  const input = document.getElementById('emailInput');
  const email = input.value.trim();
  const errorMsg = document.getElementById('errorMsg');
  const statusLine = document.getElementById('statusLine');
  const btn = document.getElementById('sendBtn');

  errorMsg.classList.remove('show');

  const emailRegex = /^[\w.-]+@[\w.-]+\.\w+$/;
  if (!emailRegex.test(email)) {
    errorMsg.classList.add('show');
    input.focus();
    return;
  }

  btn.disabled = true;
  statusLine.className = 'status-line active';
  statusLine.innerHTML = '// TRANSMITTING<span class="blink">_</span>';

  try {
    await fetch(GAS_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email })
    });

    statusLine.className = 'status-line';
    statusLine.innerHTML = '// AWAITING INPUT<span class="blink">_</span>';
    document.getElementById('modalEmail').textContent = email;
    document.getElementById('modalOverlay').classList.add('show');
    input.value = '';
  } catch (err) {
    statusLine.className = 'status-line';
    statusLine.innerHTML = '// ERROR: RETRY<span class="blink">_</span>';
  }

  btn.disabled = false;
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

document.getElementById('emailInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') sendEmail();
});

document.getElementById('emailInput').addEventListener('input', function() {
  document.getElementById('errorMsg').classList.remove('show');
});
</script>
</body>
</html>
