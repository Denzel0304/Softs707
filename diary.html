<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f8dcc0">
<meta name="color-scheme" content="light">
<title>다이어리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&display=block" rel="stylesheet">
<script>
/* 폰트 로딩 전 기본 글씨체가 잠깐 보이는 현상 방지: 폰트 준비될 때까지 화면 숨김 (최대 3초) */
(function () {
  var root = document.documentElement;
  if (!document.fonts || !document.fonts.load) return;
  root.classList.add('fonts-loading');
  var done = false;
  function show() { if (done) return; done = true; root.classList.remove('fonts-loading'); }
  setTimeout(show, 3000);
  Promise.all([
    document.fonts.load('400 20px "Nanum Pen Script"', '가나다월화수목금토일0123456789'),
    document.fonts.load('400 15px "Gowun Batang"', '가나다'),
    document.fonts.load('700 15px "Gowun Batang"', '가나다')
  ]).then(function () { return document.fonts.ready; }).then(show, show);
})();
</script>
<style>
  html.fonts-loading body { visibility: hidden; }
  :root {
    --desk: #f8dcc0;
    --desk-deep: #f1c9a1;
    --paper: #fffaf3;
    --paper-2: #fdf1e3;
    --edge-1: #f5e6d4;
    --edge-2: #ecd5bb;
    --edge-3: #e2c3a2;
    --rule: #f1dfca;
    --rule-strong: #e7cba9;
    --ink: #4a3326;
    --ink-soft: #85644f;
    --ink-mute: #b79a84;
    --accent: #e5893b;
    --accent-strong: #c46c1f;
    --accent-soft: #fde6cd;
    --hl: #ffd7a1;
    --sun: #cf543d;
    --sat: #4a76ad;
    --danger: #b9473a;
    --danger-bg: #f9e6e2;
    --danger-border: #efc3bb;

    --shadow-lg: 0 14px 34px rgba(120, 68, 28, 0.20);

    --font-ui: "Gowun Batang", "Nanum Myeongjo", "AppleMyungjo", serif;
    --font-hand: "Nanum Pen Script", "Gaegu", "Gowun Batang", cursive;

    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --topbar-h: 58px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: var(--font-ui);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    background:
      radial-gradient(120% 80% at 15% 0%, #fbe7d2 0%, transparent 60%),
      radial-gradient(100% 70% at 100% 100%, #f3cfa9 0%, transparent 65%),
      var(--desk);
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; padding: 0; text-align: inherit; }
  input, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  [hidden] { display: none !important; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* === App shell === */
  .app {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    padding-top: var(--safe-top);
  }
  .topbar {
    flex-shrink: 0;
    height: var(--topbar-h);
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px;
    padding: 0 12px;
    max-width: 1220px; width: 100%; margin: 0 auto;
  }
  .topbar-left, .topbar-right { display: flex; align-items: center; gap: 2px; min-width: 0; }
  .topbar-right { justify-content: flex-end; }
  .brand {
    display: flex; align-items: center; gap: 7px;
    font-family: var(--font-hand);
    font-size: 34px;
    line-height: 1;
    color: var(--ink);
    white-space: nowrap;
  }
  .brand svg { width: 25px; height: 25px; color: var(--accent-strong); flex-shrink: 0; }
  .sync-bar {
    min-width: 0;
    font-size: 11.5px;
    color: var(--ink-soft);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding-left: 2px;
  }
  .back-btn {
    height: 36px; padding: 0 16px 0 12px;
    border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--paper);
    border: 1px solid var(--rule-strong);
    color: var(--ink);
    box-shadow: 0 2px 6px rgba(120, 68, 28, 0.10);
    flex-shrink: 0;
  }
  .back-btn:active { background: var(--accent-soft); }
  .back-btn svg { width: 20px; height: 20px; }
  .icon-btn {
    width: 40px; height: 40px;
    border-radius: 12px;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--ink-soft);
    flex-shrink: 0;
  }
  .icon-btn:active { background: rgba(255, 250, 243, 0.6); }
  .icon-btn svg { width: 21px; height: 21px; }

  .stage {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 6px 12px calc(28px + var(--safe-bottom));
  }
  .view { max-width: 1220px; margin: 0 auto; }

  /* === Book (mobile: 한 장) === */
  .book {
    position: relative;
    background-color: var(--paper);
    background-image: linear-gradient(to right, rgba(150, 90, 40, 0.13), rgba(150, 90, 40, 0) 20px);
    border-radius: 5px 14px 14px 5px;
    box-shadow:
      2px 2px 0 var(--edge-1),
      4px 4px 0 var(--edge-2),
      6px 6px 0 var(--edge-3),
      var(--shadow-lg);
    margin-right: 6px;
  }
  .page { position: relative; padding: 18px 18px 20px 24px; }
  .page + .page { border-top: 1.5px dashed var(--rule-strong); }

  .page-head {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 10px;
    padding-bottom: 10px;
    margin-bottom: 4px;
    min-height: 58px;
  }
  .ph-title { display: flex; align-items: baseline; gap: 2px 8px; flex-wrap: wrap; min-width: 0; flex: 1; }
  .ph-big {
    font-family: var(--font-hand);
    font-size: 42px; line-height: 0.95;
    color: var(--ink);
    white-space: nowrap;
    min-width: 0; max-width: 100%;
    overflow: hidden;
  }
  .ph-small { font-size: 13px; color: var(--ink-soft); white-space: nowrap; }
  /* 달력 제목의 월·연도: 보이는 글자 위에 투명한 선택 상자를 겹쳐 둔다 */
  .ph-pick {
    position: relative;
    display: inline-flex; align-items: baseline; gap: 3px;
    border-radius: 8px;
    cursor: pointer;
  }
  .ph-pick:hover .ph-big, .ph-pick:hover .ph-small { color: var(--accent-strong); }
  .ph-pick:focus-within { outline: 2px solid var(--accent); outline-offset: 3px; }
  .ph-caret { width: 13px; height: 13px; color: var(--ink-soft); align-self: center; }
  .ph-select {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    opacity: 0;
    cursor: pointer;
    font-size: 16px;   /* iOS 확대 방지 */
    border: none;
    -webkit-appearance: none; appearance: none;
  }
  .ph-nav { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
  .nav-btn {
    width: 38px; height: 38px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--ink-soft);
  }
  .nav-btn:active { background: var(--accent-soft); }
  .nav-btn svg { width: 20px; height: 20px; }
  .today-btn {
    font-family: var(--font-hand);
    font-size: 21px; line-height: 1;
    color: var(--accent-strong);
    padding: 7px 10px 5px;
    border-radius: 10px;
  }
  .today-btn:active { background: var(--accent-soft); }

  /* === 월 달력 === */
  .dow-row, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
  .dow-row {
    font-family: var(--font-hand);
    font-size: 21px;
    color: var(--ink-soft);
    text-align: center;
    padding-bottom: 4px;
    border-bottom: 1.5px solid var(--rule-strong);
  }
  .dow-row span:first-child { color: var(--sun); }
  .dow-row span:last-child  { color: var(--sat); }

  .cell {
    position: relative;
    display: flex; flex-direction: column; align-items: center;
    padding: 6px 2px 4px;
    min-height: 54px;
    border-bottom: 1px solid var(--rule);
    border-radius: 0;
  }
  .cell:active { background: var(--paper-2); }
  .cell-num {
    position: relative;
    font-family: var(--font-hand);
    font-size: 27px; line-height: 1;
    width: 36px; height: 34px;
    display: inline-flex; align-items: center; justify-content: center;
    z-index: 1;
  }
  .cell.sun .cell-num { color: var(--sun); }
  .cell.sat .cell-num { color: var(--sat); }
  .cell.out .cell-num { opacity: 0.32; }
  .cell.has .cell-num::after {
    content: "";
    position: absolute; left: 4px; right: 4px; bottom: 3px; height: 9px;
    background: var(--hl);
    border-radius: 3px 6px 4px 5px;
    transform: rotate(-2deg);
    z-index: -1;
  }
  .cell.today .cell-num::before {
    content: "";
    position: absolute; inset: -1px -2px;
    border: 2px solid var(--accent);
    border-radius: 55% 45% 52% 48% / 50% 55% 45% 50%;
    transform: rotate(-6deg);
  }
  .cell-prev { display: none; }

  /* 월별 기록 목록 */
  .mlist-head { display: flex; align-items: baseline; gap: 8px; padding-bottom: 8px; }
  .mlist-title { font-family: var(--font-hand); font-size: 30px; line-height: 1; }
  .mlist-count { font-size: 12.5px; color: var(--ink-soft); }
  .mlist { display: flex; flex-direction: column; }
  .mitem {
    display: grid; grid-template-columns: 58px 1fr; gap: 10px;
    padding: 10px 2px;
    border-top: 1px solid var(--rule);
    width: 100%;
  }
  .mitem:active { background: var(--paper-2); }
  .mitem-date { font-family: var(--font-hand); line-height: 1; padding-top: 2px; }
  .mitem-date b { display: block; font-weight: 400; font-size: 30px; }
  .mitem-date span { font-size: 18px; color: var(--ink-soft); }
  .mitem-date.sun b, .mitem-date.sun span { color: var(--sun); }
  .mitem-date.sat b, .mitem-date.sat span { color: var(--sat); }
  .mitem-text {
    font-family: var(--font-hand);
    font-size: 19px; line-height: 22.4px;
    color: var(--ink);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden;
    white-space: pre-wrap; word-break: break-word;
  }
  .empty-note { font-size: 13.5px; color: var(--ink-soft); padding: 14px 2px; line-height: 1.7; }

  /* === 주간 페이지 === */
  .days { display: flex; flex-direction: column; }
  .day {
    display: flex; flex-direction: column;
    width: 100%;
    min-height: 128px;
    padding: 8px 2px 10px;
    border-top: 1.5px solid var(--rule-strong);
  }
  .day:active { background: var(--paper-2); }
  .day-head { display: flex; align-items: baseline; gap: 8px; font-family: var(--font-hand); line-height: 1; }
  .day-num {
    position: relative;
    font-size: 36px;
    min-width: 34px;
    text-align: center;
  }
  .day-name { font-size: 22px; color: var(--ink-soft); }
  .day-month { font-size: 19px; color: var(--ink-mute); }
  .day.dow-0 .day-num, .day.dow-0 .day-name { color: var(--sun); }
  .day.dow-6 .day-num, .day.dow-6 .day-name { color: var(--sat); }
  .day.today .day-num::before {
    content: "";
    position: absolute; inset: -3px -6px -1px;
    border: 2px solid var(--accent);
    border-radius: 55% 45% 52% 48% / 50% 55% 45% 50%;
    transform: rotate(-5deg);
  }
  .day.sel { background: linear-gradient(to right, var(--accent-soft), rgba(253, 230, 205, 0) 70%); }
  .day-body {
    flex: 1;
    margin-top: 6px;
    min-height: 78px;
    overflow: hidden;
    font-family: var(--font-hand);
    font-size: 19.5px;
    line-height: 26px;
    white-space: pre-wrap; word-break: break-word;
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 25px, var(--rule) 25px, var(--rule) 26px);
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 7;
  }

  .mini { display: none; }

  /* 모바일: 주간은 한 장에 7일이 이어진다 */
  .page-head-right, .search-right { display: none; }
  #weekView .page.left { padding-bottom: 0; }
  #weekRightPage { border-top: none; padding-top: 0; }
  @media (max-width: 899.98px) {
    /* 왼쪽 페이지를 풀어서, 제목이 한 주 전체(월~일) 동안 위에 붙어 있게 한다 */
    #weekView .page.left { display: contents; }
    #weekView .page.left > .page-head {
      position: sticky; top: -6px; z-index: 5;
      margin: 0;
      padding: 18px 18px 10px 24px;
      background-color: var(--paper);
      background-image: linear-gradient(to right, rgba(150, 90, 40, 0.13), rgba(150, 90, 40, 0) 20px);
      border-radius: 5px 14px 0 0;
      box-shadow: 0 8px 10px -10px rgba(120, 68, 28, 0.35);
    }
    #weekLeft { padding: 0 18px 0 24px; }
  }

  /* 페이지 넘김 */
  @keyframes turnNext { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }
  @keyframes turnPrev { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: none; } }
  .turn-next { animation: turnNext 0.26s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .turn-prev { animation: turnPrev 0.26s cubic-bezier(0.2, 0.8, 0.2, 1); }

  /* === 검색 === */
  .search-box {
    display: flex; align-items: center; gap: 8px;
    border-bottom: 2px solid var(--rule-strong);
    padding: 4px 2px 8px;
    margin-bottom: 6px;
  }
  .search-box svg { width: 20px; height: 20px; color: var(--ink-soft); flex-shrink: 0; }
  .search-input {
    flex: 1; min-width: 0;
    border: none; outline: none; background: transparent;
    font-size: 17px;
    padding: 6px 0;
    caret-color: var(--accent);
  }
  .search-input::placeholder { color: var(--ink-mute); }
  .search-clear { width: 32px; height: 32px; border-radius: 50%; color: var(--ink-soft); display: inline-flex; align-items: center; justify-content: center; }
  .search-clear svg { width: 17px; height: 17px; }
  .sresult {
    display: block; width: 100%;
    padding: 12px 2px;
    border-top: 1px solid var(--rule);
  }
  .sresult:active { background: var(--paper-2); }
  .sresult-date { font-family: var(--font-hand); font-size: 23px; line-height: 1.1; color: var(--ink-soft); }
  .sresult-text { font-family: var(--font-hand); font-size: 19px; line-height: 23.1px; margin-top: 3px; white-space: pre-wrap; word-break: break-word; }
  .search-count { font-size: 12.5px; color: var(--ink-soft); padding: 4px 2px 8px; }
  mark { background: var(--hl); color: inherit; border-radius: 2px; padding: 0 1px; }

  /* === PC: 펼친 두 페이지 === */
  @media (min-width: 900px) {
    .topbar { padding: 0 28px; }
    .stage { overflow: hidden; padding: 4px 28px calc(30px + var(--safe-bottom)); }
    .view { height: 100%; }

    .book {
      height: 100%;
      max-height: 860px;
      display: grid; grid-template-columns: 1fr 1fr;
      background: none; box-shadow: none; border-radius: 0;
      margin: 0 auto;
      max-width: 1180px;
    }
    .page {
      min-height: 0;
      display: flex; flex-direction: column;
      padding: 26px 34px 26px;
      background-color: var(--paper);
    }
    .page + .page { border-top: none; }
    .page-head-right { display: flex; }
    .search-right { display: flex; }
    #sCalGrid .cell { cursor: default; }
    #sCalGrid .cell:hover, #sCalGrid .cell:active { background: none; }
    #sCalGrid .cell.focus, #sCalGrid .cell.focus:hover {
      background: var(--accent-soft);
      box-shadow: inset 0 0 0 2px var(--accent);
      border-radius: 6px;
    }
    .ph-nav-mobile { display: none; }
    #weekView .page.left { padding-bottom: 26px; }
    #weekRightPage { padding-top: 26px; }
    .page.left {
      border-radius: 14px 3px 3px 14px;
      background-image: linear-gradient(to left, rgba(150, 90, 40, 0.17), rgba(150, 90, 40, 0.04) 26px, rgba(150, 90, 40, 0) 60px);
      box-shadow:
        -2px 2px 0 var(--edge-1),
        -4px 4px 0 var(--edge-2),
        -6px 6px 0 var(--edge-3),
        var(--shadow-lg);
      border-right: 1px solid rgba(150, 90, 40, 0.14);
    }
    .page.right {
      border-radius: 3px 14px 14px 3px;
      background-image: linear-gradient(to right, rgba(150, 90, 40, 0.17), rgba(150, 90, 40, 0.04) 26px, rgba(150, 90, 40, 0) 60px);
      box-shadow:
        2px 2px 0 var(--edge-1),
        4px 4px 0 var(--edge-2),
        6px 6px 0 var(--edge-3),
        var(--shadow-lg);
    }
    .page-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .scroll-y { overflow-y: auto; }

    /* 달력: 칸이 페이지 높이를 채운다 */
    .cal-grid { flex: 1; min-height: 0; }
    .cell {
      align-items: stretch;
      padding: 5px 5px 4px;
      min-height: 0;
      overflow: hidden;
      border-right: 1px solid var(--rule);
    }
    .cell:nth-child(7n) { border-right: none; }
    .cell-num { width: 34px; height: 30px; font-size: 26px; }
    .cell-prev {
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
      font-family: var(--font-hand);
      font-size: 15.5px; line-height: 16.7px;
      color: var(--ink-soft);
      padding: 2px 2px 0;
      word-break: break-all;
    }
    .cell:hover { background: var(--paper-2); }

    /* 주간: 왼쪽 월~목, 오른쪽 금~일 + 미니 달력 */
    .days { flex: 1; min-height: 0; }
    .day, .mini { flex: 1 1 0; min-height: 0; }
    .day:hover { background: var(--paper-2); }
    .day.sel:hover { background: linear-gradient(to right, var(--accent-soft), rgba(253, 230, 205, 0) 70%); }
    .day-body {
      min-height: 0;
      display: block; -webkit-line-clamp: unset;
      -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 26px), transparent);
              mask-image: linear-gradient(to bottom, #000 calc(100% - 26px), transparent);
    }
    .day-body:empty { -webkit-mask-image: none; mask-image: none; }
    .mini {
      display: flex; flex-direction: column;
      border-top: 1.5px solid var(--rule-strong);
      padding: 10px 6px 0;
    }
    .mini-head { display: flex; align-items: center; justify-content: space-between; }
    .mini-title { font-family: var(--font-hand); font-size: 25px; line-height: 1; }
    .mini-nav { display: flex; }
    .mini-nav .nav-btn { width: 30px; height: 30px; }
    .mini-nav .nav-btn svg { width: 16px; height: 16px; }
    .mini-dow, .mini-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
    .mini-dow { font-family: var(--font-hand); font-size: 17px; color: var(--ink-soft); margin-top: 4px; }
    .mini-dow span:first-child { color: var(--sun); }
    .mini-dow span:last-child { color: var(--sat); }
    .mini-grid { flex: 1; min-height: 0; grid-auto-rows: 1fr; }
    .mini-cell {
      font-family: var(--font-hand);
      font-size: 18px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      min-height: 0;
    }
    .mini-cell.out { opacity: 0.3; }
    .mini-cell.sun { color: var(--sun); }
    .mini-cell.sat { color: var(--sat); }
    .mini-cell.inweek { background: var(--accent-soft); }
    .mini-cell.has::after {
      content: ""; position: absolute; bottom: 2px; left: 50%;
      width: 4px; height: 4px; margin-left: -2px; border-radius: 50%;
      background: var(--accent);
    }
    .mini-cell.today::before {
      content: "";
      position: absolute; left: 50%; top: 50%;
      width: 1.5em; height: 1.3em;
      border: 1.5px solid var(--accent);
      border-radius: 55% 45% 52% 48% / 50% 55% 45% 50%;
      transform: translate(-50%, -50%) rotate(-6deg);
      pointer-events: none;
    }
    .mini-cell:hover { background: var(--paper-2); }
    .mini-cell.inweek:hover { background: var(--hl); }

    .mlist { overflow-y: auto; min-height: 0; }
    .mitem:hover, .sresult:hover { background: var(--paper-2); }
  }

  /* === Modal === */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(74, 51, 38, 0.36);
    z-index: 100;
    display: none;
    align-items: flex-end;
    justify-content: center;
    animation: fadeIn 0.18s ease;
  }
  .modal-overlay.show { display: flex; }
  .modal-overlay.center { align-items: center; padding: 24px; }

  @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .sheet {
    background-color: var(--paper);
    background-image: linear-gradient(to right, rgba(150, 90, 40, 0.10), rgba(150, 90, 40, 0) 16px);

    flex-shrink: 0;

  .editor-date { text-align: center; line-height: 1; min-width: 0; }

  .editor-date-sub { display: block; font-size: 12px; color: var(--ink-soft); margin-top: 4px; }
  .editor-date.sun .editor-date-main { color: var(--sun); }

  .editor-cancel, .editor-save {
    font-size: 14px;
    font-weight: 700;
    border-radius: 10px;
    transition: background 0.15s, transform 0.15s;
    text-align: center;

  .editor-cancel {
    color: var(--ink);

  .editor-cancel:active { background: var(--accent-soft); }
  .editor-save {
    color: #fff;
    background: var(--accent);
    padding: 8px 18px;
  }
  .editor-save:active { background: var(--accent-strong); transform: scale(0.96); }

  .editor-textarea {
    font-family: var(--font-hand);
    flex: 1;
    width: 100%;
    min-height: 140px;
    border: 1.5px solid var(--rule-strong);
    border-radius: 12px;
    padding: 12px 14px;
    background-color: #fffdf9;
    background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 27px, var(--rule) 27px, var(--rule) 28px);

    background-position: 0 12px;
    font-size: 21.5px;
    line-height: 28px;
    resize: none;
    outline: none;
    transition: border-color 0.15s;
    caret-color: var(--accent);

  .editor-textarea::placeholder { color: var(--ink-mute); }
  .editor-textarea:focus { border-color: var(--accent); }

  /* 모바일: 입력칸은 10줄 높이로, 모달은 내용만큼만 */

      flex: 0 1 auto;                         /* 키보드가 올라와 공간이 좁아지면 줄어든다 */

  .editor-links {

  /* Toast */

const SB_URL  = 'https://zkkhzsgaryoraytvsqbf.supabase.co';
const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpra2h6c2dhcnlvcmF5dHZzcWJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mzc5ODM5OTcsImV4cCI6MjA1MzU1OTk5N30.UJtqcka35dVssnZRuUk6zukfjF9UNX392Shd841GSQk';

const LS_AK      = 'zDiary77_ak';
const LS_CACHE   = 'zDiary77_cache';
const LS_PENDING = 'zDiary77_pending';
const HS_KEY     = 'zDiary77';           // history.state 키
const PIN_LEN    = 6;

const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const ORD = ['첫째', '둘째', '셋째', '넷째', '다섯째'];

/* ---------- State ---------- */
let entries = {};          // { 'YYYY-MM-DD': { c: 내용, u: 수정시각 } }
let pending = {};          // { 'YYYY-MM-DD': 내용 } 서버에 아직 못 보낸 저장 ('' = 삭제)
let viewMonth = firstOfMonth(new Date());
let weekStart = mondayOf(new Date());
let selDate = null;        // 주간 페이지에서 강조할 날짜
let miniMonth = null;      // PC 미니 달력에 보이는 달
let editingDate = null;
let currentSearch = '';
let confirmAction = null;  // 'delete' | 'logout'
let flushing = false, pulling = false, lastPullAt = 0;
let authFailCount = 0;
const AUTH_FAIL_MAX = 3;
let resetListMode = null;

/* ---------- 날짜 유틸 ---------- */
function pad(n) { return String(n).padStart(2, '0'); }
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseYmd(s) { const a = s.split('-').map(Number); return new Date(a[0], a[1] - 1, a[2]); }
function addDays(d, n) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; }
function firstOfMonth(d) { return new Date(d.getFullYear(), d.getMonth(), 1); }
function mondayOf(d) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function todayKey() { return ymd(new Date()); }
function dowClass(d) { const w = d.getDay(); return w === 0 ? 'sun' : (w === 6 ? 'sat' : ''); }

/* ---------- 기본 유틸 ---------- */
function getAK() { return localStorage.getItem(LS_AK); }
function setAK(k) { localStorage.setItem(LS_AK, k); }
function setSyncBar(text) {
  const el = document.getElementById('sync-bar');
  if (el) el.textContent = text;
}
function stripZws(s) { return (s || '').replace(/\u200b/g, ''); }
function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}
function highlight(text, q) {
  const safe = escapeHtml(text);
  if (!q) return safe;
  const re = new RegExp('(' + escapeHtml(q).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
  return safe.replace(re, '<mark>$1</mark>');
}
function firstLine(c) {
  const lines = stripZws(c).split('\n');
  for (const l of lines) { if (l.trim()) return l.trim(); }
  return '';
}

/* ---------- 로컬 캐시 ---------- */
function saveCache() {
  try {
    localStorage.setItem(LS_CACHE, JSON.stringify(entries));
    localStorage.setItem(LS_PENDING, JSON.stringify(pending));
  } catch (_) {}
}
function loadCache() {
  try { const c = localStorage.getItem(LS_CACHE); if (c) entries = JSON.parse(c) || {}; } catch (_) { entries = {}; }
  try { const p = localStorage.getItem(LS_PENDING); if (p) pending = JSON.parse(p) || {}; } catch (_) { pending = {}; }
}
function pendingCount() { return Object.keys(pending).length; }

/* =========================================================
   Supabase RPC / 로그인 / 동기화
   ========================================================= */
async function rpc(fn, args) {
  return fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: {
      'apikey': SB_ANON,
      'Authorization': 'Bearer ' + SB_ANON,
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(args)
  });
}

async function doLogin() {
  const pin = document.getElementById('pin-input').value.trim();
  const msg = document.getElementById('login-msg');
  const btn = document.getElementById('login-btn');
  if (!new RegExp('^\\d{' + PIN_LEN + '}$').test(pin)) {
    msg.className = 'login-msg err'; msg.textContent = `PIN ${PIN_LEN}자리 숫자를 입력하세요`; return;
  }
  btn.disabled = true; msg.className = 'login-msg'; msg.textContent = '확인 중...';
  try {
    const r = await rpc('zDiary77_login', { p_pin: pin });
    if (!r.ok) { msg.className = 'login-msg err'; msg.textContent = '서버 오류 (' + r.status + ')'; btn.disabled = false; return; }
    const data = await r.json();
    if (data.ok) {
      setAK(data.key);
      document.getElementById('pin-input').value = '';
      msg.className = 'login-msg ok'; msg.textContent = '로그인 성공';
      await afterLogin();
    } else if (data.reason === 'wrong_pin') {
      msg.className = 'login-msg err'; msg.textContent = `PIN 불일치 (남은 시도: ${data.remaining}회)`;
      document.getElementById('pin-input').value = ''; btn.disabled = false;
    } else if (data.reason === 'locked') {
      const until = new Date(data.until).toLocaleTimeString('ko-KR');
      msg.className = 'login-msg err'; msg.textContent = `잠금 상태 (${until}까지)`;
      document.getElementById('pin-input').value = ''; btn.disabled = false;
    } else if (data.reason === 'no_pin') {
      msg.className = 'login-msg err'; msg.textContent = 'PIN이 등록되지 않았습니다'; btn.disabled = false;
    } else if (data.reason === 'bad_format') {
      msg.className = 'login-msg err'; msg.textContent = `PIN ${PIN_LEN}자리 숫자를 입력하세요`; btn.disabled = false;
    } else {
      msg.className = 'login-msg err'; msg.textContent = '로그인 실패'; btn.disabled = false;
    }
  } catch (e) {
    msg.className = 'login-msg err'; msg.textContent = '네트워크 오류'; btn.disabled = false;
  }
}

async function afterLogin() {
  document.getElementById('login-overlay').classList.remove('active');
  await syncNow();
}

async function doLogout() {
  // 열린 화면·모달은 모두 즉시 닫고, 히스토리는 기본 상태로 되돌린다
  forceResetLayers();

  // 보내지 못한 저장이 있으면 마지막으로 한 번 시도
  try { await flushPending(); } catch (_) {}

  const key = getAK();
  if (key) { try { await rpc('zDiary77_logout', { p_key: key }); } catch (e) {} }
  Object.keys(localStorage).forEach(k => { if (k.startsWith(LS_PREFIX)) localStorage.removeItem(k); });
  entries = {};
  pending = {};
  renderAll();
  document.getElementById('login-overlay').classList.add('active');
  document.getElementById('login-btn').disabled = false;
  document.getElementById('login-msg').textContent = '';
  authFailCount = 0;
  setSyncBar('');
  setTimeout(() => document.getElementById('pin-input').focus(), 50);
}

function isUnauthorized(r, text) {
  return r.status === 401 || r.status === 403 || (text && text.includes('unauthorized'));
}

function registerAuthFail() {
  authFailCount++;
  setSyncBar(`⚠ 인증 오류 (${authFailCount}/${AUTH_FAIL_MAX})`);
  if (authFailCount >= AUTH_FAIL_MAX) doLogout();
}

// 서버의 최신본을 불러온다. 아직 보내지 못한 로컬 저장은 그 위에 덮는다.
async function pullFromServer() {
  const key = getAK();
  if (!key || pulling) return;
  pulling = true;
  setSyncBar('↓ 불러오는 중...');
  try {
    const r = await rpc('zDiary77_pull', { p_key: key });
    if (!r.ok) {
      const t = await r.text();
      if (isUnauthorized(r, t)) { registerAuthFail(); return; }
      setSyncBar('⚠ 불러오기 실패'); return;
    }
    authFailCount = 0;
    const data = await r.json();
    const next = {};
    (Array.isArray(data) ? data : []).forEach(row => {
      if (row && row.d) next[row.d] = { c: row.c || '', u: row.u || '' };
    });
    Object.keys(pending).forEach(d => {
      if (pending[d] === '') delete next[d];
      else next[d] = { c: pending[d], u: (entries[d] && entries[d].u) || '' };
    });
    entries = next;
    lastPullAt = Date.now();
    saveCache();
    setSyncBar(pendingCount() ? `● 저장 대기 ${pendingCount()}개` : '✓ 동기화됨');
    renderAll();
  } catch (e) {
    setSyncBar('⚠ 네트워크 오류');
  } finally {
    pulling = false;
  }
}

// 저장 대기 중인 날짜들을 서버로 보낸다.
async function flushPending() {
  const key = getAK();
  if (!key || flushing) return;
  if (pendingCount() === 0) return;
  flushing = true;
  setSyncBar('↑ 저장 중...');
  let failed = false;
  try {
    for (const d of Object.keys(pending)) {
      const sent = pending[d];
      let r;
      try {
        r = await rpc('zDiary77_save', { p_key: key, p_date: d, p_content: sent });
      } catch (e) { failed = true; break; }
      if (!r.ok) {
        const t = await r.text();
        if (isUnauthorized(r, t)) { registerAuthFail(); failed = true; break; }
        failed = true; break;
      }
      authFailCount = 0;
      const res = await r.json();
      if (res && res.ok) {
        // 보내는 동안 같은 날짜를 다시 고쳤다면 대기 목록에 남겨 둔다
        if (pending[d] === sent) delete pending[d];
        if (res.u && entries[d]) entries[d].u = res.u;
      } else {
        // 서버가 거절한 저장(너무 긴 글 등)은 다시 보내지 않는다
        if (pending[d] === sent) delete pending[d];
        if (res && res.reason === 'too_long') toast('글이 너무 길어 저장하지 못했습니다');
      }
      saveCache();
    }
  } finally {
    flushing = false;
  }
  if (failed) setSyncBar(`⚠ 저장 대기 ${pendingCount()}개`);
  else if (pendingCount() > 0) flushPending();
  else setSyncBar('✓ 저장됨');
}

async function syncNow() {
  await flushPending();
  await pullFromServer();
}

/* =========================================================
   LAYER / HISTORY SYSTEM
   ---------------------------------------------------------
   0단계: 월 달력 (기본 화면)
   1단계: 'week'(주간 페이지) 또는 'search'(검색) — 달력에서만 열림
   2단계: 'editor'(그날 기록 입력 모달)
   3단계: 'confirm'(지우기·로그아웃 확인)
   - 열기: pushLayer(type) → history.pushState 1회 ({ zDiary77: 깊이 })
   - 닫기: closeTo(깊이) → history.go(-n), 실제 닫기는 popstate에서만 처리
   - popstate: 도착한 state의 깊이까지 위에서부터 층을 닫는다
   - 같은 층 안의 화면 변화(달·주 넘기기, 검색어 입력)는 기록을 쌓지 않는다
   ========================================================= */
const layers = [];
let navPending = false;
let navPendingTimer = null;
let booting = false;

if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

function hsState(depth) { const o = {}; o[HS_KEY] = depth; return o; }

function setNavPending(v) {
  navPending = v;
  clearTimeout(navPendingTimer);
  if (v) navPendingTimer = setTimeout(() => { navPending = false; }, 800);
}

function pushLayer(type) {
  if (navPending) return false;
  layers.push(type);
  history.pushState(hsState(layers.length), '');
  return true;
}

function closeTo(depth) {
  if (navPending) return;
  const n = layers.length - depth;
  if (n <= 0) return;
  setNavPending(true);
  history.go(-n);
}

function closeTop() {
  if (layers.length === 0) return;
  closeTo(layers.length - 1);
}

function topLayer() { return layers[layers.length - 1]; }

window.addEventListener('popstate', (e) => {
  if (booting) {
    // 새로고침 직후 남아있던 상위 기록을 정리하는 단계
    booting = false;
    history.replaceState(hsState(0), '');
    return;
  }
  setNavPending(false);
  const target = (e.state && typeof e.state[HS_KEY] === 'number') ? e.state[HS_KEY] : 0;
  if (target > layers.length) {
    // 브라우저 '앞으로' 버튼 등으로 실제보다 깊은 기록에 도착 → 되돌린다
    setNavPending(true);
    history.go(layers.length - target);
    return;
  }
  while (layers.length > target) teardownLayer(layers.pop());
});

function teardownLayer(type) {
  if (type === 'week') {
    // 마지막으로 보던 주가 속한 달로 달력을 맞춘다 (목요일 기준)
    viewMonth = firstOfMonth(addDays(weekStart, 3));
    selDate = null;
    showView('cal');
    renderCalendar();
  } else if (type === 'search') {
    const input = document.getElementById('searchInput');
    input.value = '';
    currentSearch = '';
    input.blur();
    showView('cal');
    renderCalendar();
  } else if (type === 'editor') {
    document.getElementById('editorModal').classList.remove('show');
    resetEditor();
  } else if (type === 'confirm') {
    document.getElementById('confirmModal').classList.remove('show');
    confirmAction = null;
  }
}

// 로그아웃처럼 즉시 모든 층을 걷어내야 할 때
function forceResetLayers() {
  const n = layers.length;
  if (n === 0) return;
  while (layers.length > 0) teardownLayer(layers.pop());
  // 쌓여 있던 기록도 기본 위치로 되돌린다 (도착 popstate는 깊이 0이라 아무것도 닫지 않음)
  setNavPending(true);
  history.go(-n);
}

// 새로고침 시 이전 기록 위에 있었다면 기본 기록으로 내려간다
(function bootHistory() {
  const st = history.state;
  const depth = (st && typeof st[HS_KEY] === 'number') ? st[HS_KEY] : 0;
  if (depth > 0) {
    booting = true;
    history.go(-depth);
  } else {
    history.replaceState(hsState(0), '');
  }
})();

/* ---------- 화면 전환 ---------- */
function showView(name) {
  document.getElementById('calView').hidden = name !== 'cal';
  document.getElementById('weekView').hidden = name !== 'week';
  document.getElementById('searchView').hidden = name !== 'search';
  document.getElementById('backBtn').hidden = name === 'cal';
  document.getElementById('sync-bar').hidden = name !== 'cal';
  document.getElementById('searchBtn').hidden = name !== 'cal';
  document.getElementById('logoutBtn').hidden = name !== 'cal';
  document.getElementById('stage').scrollTop = 0;
}

function openWeek(dateKey) {
  if (layers.length !== 0) return;
  if (!pushLayer('week')) return;
  const d = parseYmd(dateKey);
  weekStart = mondayOf(d);
  selDate = dateKey;
  miniMonth = null;
  showView('week');
  renderWeek();
  // 모바일: 고른 날짜가 보이도록 스크롤
  requestAnimationFrame(() => {
    if (isPcLayout()) return;
    const el = document.querySelector(`#weekView .day[data-date="${dateKey}"]`);
    const stage = document.getElementById('stage');
    const head = document.querySelector('#weekView .page.left > .page-head');
    if (el) {
      const y = el.getBoundingClientRect().top - stage.getBoundingClientRect().top + stage.scrollTop;
      stage.scrollTop = Math.max(0, y - (head ? head.offsetHeight : 0) + 6);
    }
  });
}

function openSearch() {
  if (layers.length !== 0) return;
  if (!pushLayer('search')) return;
  showView('search');
  renderSearch();
  setTimeout(() => document.getElementById('searchInput').focus(), 50);
}

function isPcLayout() { return window.matchMedia('(min-width: 900px)').matches; }

/* ---------- Overlay click closes top modal ---------- */
function bindOverlayClicks() {
  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) closeTop();
    });
  });
}

/* ---------- Toast ---------- */
let toastTimer = null;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
}

function turn(el, dir) {
  if (!el || !dir) return;
  el.classList.remove('turn-next', 'turn-prev');
  void el.offsetWidth;
  el.classList.add(dir > 0 ? 'turn-next' : 'turn-prev');
}

/* =========================================================
   RENDER
   ========================================================= */
function renderAll() {
  renderCalendar();
  if (!document.getElementById('weekView').hidden) renderWeek();
  if (!document.getElementById('searchView').hidden) renderSearch();
}

/* ---------- 월 달력 ---------- */
function renderCalendar() {
  const y = viewMonth.getFullYear(), m = viewMonth.getMonth();
  document.getElementById('calMonth').textContent = (m + 1) + '월';
  document.getElementById('calYear').textContent = y + '년';
  fillMonthYearPickers(y, m);

  const first = new Date(y, m, 1);
  const daysIn = new Date(y, m + 1, 0).getDate();
  const rows = Math.ceil((first.getDay() + daysIn) / 7);
  const start = addDays(first, -first.getDay());
  const tk = todayKey();
  let html = '';
  for (let i = 0; i < rows * 7; i++) {
    const d = addDays(start, i);
    const k = ymd(d);
    const e = entries[k];
    const cls = ['cell', dowClass(d)];
    if (d.getMonth() !== m) cls.push('out');
    if (k === tk) cls.push('today');
    if (e) cls.push('has');
    const prev = e ? escapeHtml(firstLine(e.c)) : '';
    html += `<button class="${cls.join(' ')}" data-date="${k}" aria-label="${d.getMonth() + 1}월 ${d.getDate()}일${e ? ', 기록 있음' : ''}">` +
            `<span class="cell-num">${d.getDate()}</span>` +
            `<span class="cell-prev">${prev}</span></button>`;
  }
  const grid = document.getElementById('calGrid');
  grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
  grid.innerHTML = html;

  renderMonthList();
}

// 월·연도 선택 상자 채우기 (연도: 기록이 있는 해 ~ 올해 앞뒤까지)
function fillMonthYearPickers(y, m) {
  const ms = document.getElementById('calMonthSel');
  const ys = document.getElementById('calYearSel');
  if (ms.options.length !== 12) {
    ms.innerHTML = Array.from({ length: 12 }, (_, i) => `<option value="${i}">${i + 1}월</option>`).join('');
  }
  ms.value = String(m);
  const thisYear = new Date().getFullYear();
  let minY = Math.min(thisYear - 10, y), maxY = Math.max(thisYear + 5, y);
  Object.keys(entries).forEach(k => {
    const yy = parseInt(k.slice(0, 4), 10);
    if (yy < minY) minY = yy;
    if (yy > maxY) maxY = yy;
  });
  const sig = minY + '-' + maxY;
  if (ys.dataset.sig !== sig) {
    let html = '';
    for (let yy = maxY; yy >= minY; yy--) html += `<option value="${yy}">${yy}년</option>`;
    ys.innerHTML = html;
    ys.dataset.sig = sig;
  }
  ys.value = String(y);
}

function jumpToMonth(y, m) {
  const t = new Date(y, m, 1);
  const dir = t > viewMonth ? 1 : (t < viewMonth ? -1 : 0);
  viewMonth = t;
  renderCalendar();
  turn(document.getElementById('calBook'), dir);
}

function renderMonthList() {
  const y = viewMonth.getFullYear(), m = viewMonth.getMonth();
  const prefix = y + '-' + pad(m + 1) + '-';
  const keys = Object.keys(entries).filter(k => k.startsWith(prefix)).sort();
  document.getElementById('mlistTitle').textContent = (m + 1) + '월의 기록';
  document.getElementById('mlistCount').textContent = keys.length ? keys.length + '일' : '';
  const box = document.getElementById('mlist');
  if (keys.length === 0) {
    box.innerHTML = '<div class="empty-note">이 달에는 아직 기록이 없습니다.<br>달력에서 날짜를 눌러 적어 보세요.</div>';
    return;
  }
  box.innerHTML = keys.map(k => {
    const d = parseYmd(k);
    return `<button class="mitem" data-date="${k}">` +
           `<span class="mitem-date ${dowClass(d)}"><b>${d.getDate()}</b><span>${DOW[d.getDay()]}요일</span></span>` +
           `<span class="mitem-text">${escapeHtml(stripZws(entries[k].c))}</span></button>`;
  }).join('');
}

/* ---------- 주간 페이지 ---------- */
function weekLabel(ws) {
  const thu = addDays(ws, 3);
  const idx = Math.floor((thu.getDate() - 1) / 7);
  return { month: thu.getMonth() + 1, year: thu.getFullYear(), ord: ORD[idx] || (idx + 1) + '번째' };
}

function renderWeek(dir) {
  const lab = weekLabel(weekStart);
  document.getElementById('weekTitle').textContent = `${lab.month}월 ${lab.ord} 주`;
  const end = addDays(weekStart, 6);
  const sameMonth = weekStart.getMonth() === end.getMonth();
  document.getElementById('weekRange').textContent =
    `${lab.year}년 ${weekStart.getMonth() + 1}월 ${weekStart.getDate()}일 – ` +
    (sameMonth ? '' : `${end.getMonth() + 1}월 `) + `${end.getDate()}일`;
  fitOneLine(document.getElementById('weekTitle'));

  const tk = todayKey();
  const dayHtml = (i) => {
    const d = addDays(weekStart, i);
    const k = ymd(d);
    const e = entries[k];
    const cls = ['day', 'dow-' + d.getDay()];
    if (k === tk) cls.push('today');
    if (k === selDate) cls.push('sel');
    const showMonth = i === 0 || d.getDate() === 1;
    return `<button class="${cls.join(' ')}" data-date="${k}" aria-label="${d.getMonth() + 1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일">` +
           `<span class="day-head"><span class="day-num">${d.getDate()}</span>` +
           `<span class="day-name">${DOW[d.getDay()]}요일</span>` +
           (showMonth ? `<span class="day-month">${d.getMonth() + 1}월</span>` : '') +
           `</span><span class="day-body">${e ? escapeHtml(stripZws(e.c)) : ''}</span></button>`;
  };
  let left = '', right = '';
  for (let i = 0; i < 4; i++) left += dayHtml(i);
  for (let i = 4; i < 7; i++) right += dayHtml(i);
  right += '<div class="mini" id="mini"></div>';
  document.getElementById('weekLeft').innerHTML = left;
  document.getElementById('weekRight').innerHTML = right;
  renderMini();
  if (dir) turn(document.getElementById('weekBook'), dir);
}

// 한 줄에 들어가지 않으면 글자 크기를 조금씩 줄인다 (줄바꿈 방지)
function fitOneLine(el) {
  if (!el || el.offsetParent === null) return;   // 화면에 보이지 않을 때는 측정하지 않는다
  el.style.fontSize = '';
  let size = parseFloat(getComputedStyle(el).fontSize) || 42;
  while (el.scrollWidth > el.clientWidth + 1 && size > 22) {
    size -= 1;
    el.style.fontSize = size + 'px';
  }
}

function renderMini() {
  const box = document.getElementById('mini');
  if (!box) return;
  const base = miniMonth || firstOfMonth(addDays(weekStart, 3));
  const y = base.getFullYear(), m = base.getMonth();
  const first = new Date(y, m, 1);
  const daysIn = new Date(y, m + 1, 0).getDate();
  const rows = Math.ceil((first.getDay() + daysIn) / 7);
  const start = addDays(first, -first.getDay());
  const wsKey = ymd(weekStart), weKey = ymd(addDays(weekStart, 6));
  const tk = todayKey();
  let cells = '';
  for (let i = 0; i < rows * 7; i++) {
    const d = addDays(start, i);
    const k = ymd(d);
    const cls = ['mini-cell', dowClass(d)];
    if (d.getMonth() !== m) cls.push('out');
    if (k >= wsKey && k <= weKey) cls.push('inweek');
    if (entries[k]) cls.push('has');
    if (k === tk) cls.push('today');
    cells += `<button class="${cls.join(' ')}" data-mini="${k}">${d.getDate()}</button>`;
  }
  box.innerHTML =
    `<div class="mini-head"><span class="mini-title">${y}년 ${m + 1}월</span>` +
    `<span class="mini-nav"><button class="nav-btn" data-mini-step="-1" aria-label="지난 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></button>` +
    `<button class="nav-btn" data-mini-step="1" aria-label="다음 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button></span></div>` +
    `<div class="mini-dow"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>` +
    `<div class="mini-grid" style="grid-template-rows:repeat(${rows},1fr)">${cells}</div>`;
}

function stepWeek(n) {
  weekStart = addDays(weekStart, 7 * n);
  selDate = null;
  miniMonth = null;
  renderWeek(n);
}
function gotoThisWeek() {
  const ws = mondayOf(new Date());
  const dir = ws > weekStart ? 1 : (ws < weekStart ? -1 : 0);
  weekStart = ws;
  selDate = todayKey();
  miniMonth = null;
  renderWeek(dir);
}
function stepMonth(n) {
  viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + n, 1);
  renderCalendar();
  turn(document.getElementById('calBook'), n);
}
function gotoThisMonth() {
  const t = firstOfMonth(new Date());
  const dir = t > viewMonth ? 1 : (t < viewMonth ? -1 : 0);
  viewMonth = t;
  renderCalendar();
  turn(document.getElementById('calBook'), dir);
}

/* ---------- 검색 ---------- */
function snippet(text, q) {
  const clean = stripZws(text);
  if (!q) return clean.slice(0, 120);
  const i = clean.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return clean.slice(0, 120);
  const s = Math.max(0, i - 40), e = Math.min(clean.length, i + q.length + 90);
  return (s > 0 ? '…' : '') + clean.slice(s, e) + (e < clean.length ? '…' : '');
}

function renderSearch() {
  const q = currentSearch.trim();
  const list = document.getElementById('searchList');
  const count = document.getElementById('searchCount');
  document.getElementById('searchClear').hidden = currentSearch.length === 0;
  if (!q) {
    count.textContent = '찾을 낱말을 입력하면 그 낱말이 들어간 날짜를 모아 보여 드립니다.';
    list.innerHTML = '';
    renderSearchCal(todayKey(), false);
    return;
  }
  const ql = q.toLowerCase();
  const keys = Object.keys(entries)
    .filter(k => stripZws(entries[k].c).toLowerCase().includes(ql))
    .sort().reverse();
  count.textContent = keys.length ? `${keys.length}일에서 찾았습니다` : '찾는 낱말이 들어간 기록이 없습니다.';
  const item = (k) => {
    const d = parseYmd(k);
    return `<button class="sresult" data-date="${k}">` +
           `<div class="sresult-date">${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일</div>` +
           `<div class="sresult-text">${highlight(snippet(entries[k].c, q), q)}</div></button>`;
  };
  list.innerHTML = keys.map(item).join('');
  // 오른쪽 달력: 처음에는 가장 최근 결과의 달
  if (keys.length) renderSearchCal(keys[0], true);
  else renderSearchCal(todayKey(), false);
}

// PC 검색 화면 오른쪽 페이지: 가리킨 날짜가 속한 달의 달력 (메인 달력과 같은 모양, 보기 전용)
let sCalShown = null;   // 지금 오른쪽 달력이 가리키는 날짜 (같은 항목 위에서 다시 그리지 않기 위함)
function renderSearchCal(dateKey, withFocus) {
  sCalShown = withFocus ? dateKey : null;
  const base = parseYmd(dateKey);
  const y = base.getFullYear(), m = base.getMonth();
  document.getElementById('sCalMonth').textContent = (m + 1) + '월';
  document.getElementById('sCalYear').textContent = y + '년';
  const first = new Date(y, m, 1);
  const daysIn = new Date(y, m + 1, 0).getDate();
  const rows = Math.ceil((first.getDay() + daysIn) / 7);
  const start = addDays(first, -first.getDay());
  const tk = todayKey();
  let html = '';
  for (let i = 0; i < rows * 7; i++) {
    const d = addDays(start, i);
    const k = ymd(d);
    const e = entries[k];
    const cls = ['cell', dowClass(d)];
    if (d.getMonth() !== m) cls.push('out');
    if (k === tk) cls.push('today');
    if (e) cls.push('has');
    if (withFocus && k === dateKey) cls.push('focus');
    const prev = e ? escapeHtml(firstLine(e.c)) : '';
    html += `<div class="${cls.join(' ')}">` +
            `<span class="cell-num">${d.getDate()}</span>` +
            `<span class="cell-prev">${prev}</span></div>`;
  }
  const grid = document.getElementById('sCalGrid');
  grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
  grid.innerHTML = html;
}

/* =========================================================
   EDITOR
   ========================================================= */
function extractUrls(text) {
  const regex = /https?:\/\/[^\s]+/g;
  const found = text.match(regex) || [];
  const cleaned = found.map(u => u.replace(/[)\]}>,.!?;:'"]+$/, ''));
  const seen = new Set();
  const result = [];
  cleaned.forEach(u => {
    if (u && !seen.has(u)) {
      seen.add(u);
      result.push(u);
    }
  });
  return result;
}

function updateEditorLinks() {
  const et = document.getElementById('editorText');
  const box = document.getElementById('editorLinks');
  const urls = extractUrls(stripZws(et.value));
  if (urls.length === 0) {
    box.innerHTML = '';
    return;
  }
  box.innerHTML = urls.map(u => `
    <a class="editor-link" href="${u.replace(/"/g, '&quot;')}" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/>
        <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>
      </svg>
      <span>${escapeHtml(u)}</span>
    </a>
  `).join('');
}

function resetEditor() {
  const et = document.getElementById('editorText');
  et.value = '';
  document.getElementById('editorLinks').innerHTML = '';
  document.getElementById('editorActions').style.display = 'none';
  editingDate = null;
  if (resetListMode) resetListMode();
}

function openEditor(dateKey) {
  if (!pushLayer('editor')) return;
  resetEditor();
  editingDate = dateKey;
  const d = parseYmd(dateKey);
  const e = entries[dateKey];
  const et = document.getElementById('editorText');
  const dateBox = document.getElementById('editorDate');
  dateBox.className = 'editor-date ' + dowClass(d);
  document.getElementById('editorDateMain').textContent = `${d.getMonth() + 1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일`;
  document.getElementById('editorDateSub').textContent = `${d.getFullYear()}년`;
  et.value = e ? e.c : '';
  document.getElementById('editorActions').style.display = e ? 'flex' : 'none';
  updateEditorLinks();
  document.getElementById('editorModal').classList.add('show');
  setTimeout(() => {
    et.scrollTop = 0;
    document.querySelector('#editorModal .sheet').scrollTop = 0;
    document.getElementById('editorLinks').scrollTop = 0;
    // PC에서만 바로 입력할 수 있게 커서를 둔다.
    // (모바일은 키보드가 먼저 뜨면 뒤로가기가 키보드부터 닫으므로 자동 포커스하지 않는다)
    if (window.matchMedia('(pointer: fine)').matches) {
      et.focus();
      et.selectionStart = et.selectionEnd = et.value.length;
    }
  }, 50);
}

function trySave() {
  if (!editingDate) { closeTop(); return; }
  const k = editingDate;
  const text = stripZws(document.getElementById('editorText').value).trim();
  const before = entries[k] ? entries[k].c : '';

  if (!text) {
    if (entries[k]) {
      delete entries[k];
      pending[k] = '';
      saveCache();
      flushPending();
      toast('이날 기록을 지웠습니다');
    }
    renderAll();
    closeTop();
    return;
  }
  if (text !== before) {
    entries[k] = { c: text, u: new Date().toISOString() };
    pending[k] = text;
    saveCache();
    flushPending();
    toast('저장했습니다');
  }
  renderAll();
  closeTop();
}

/* ---------- 확인 모달 (지우기 / 로그아웃) ---------- */
function askConfirm(action) {

      saveCache();

}

/* ---------- 스와이프로 넘기기 (모바일) ---------- */
function bindSwipe(el, onStep) {
  let sx = 0, sy = 0, st = 0, tracking = false;
  el.addEventListener('touchstart', (e) => {
    if (e.touches.length !== 1) { tracking = false; return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY; st = Date.now(); tracking = true;
  }, { passive: true });
  el.addEventListener('touchend', (e) => {
    if (!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if (Date.now() - st > 700) return;
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
    onStep(dx < 0 ? 1 : -1);
  }, { passive: true });
}

    const ms = e.target.closest('[data-mini-step]');
    if (ms) {

      miniMonth = new Date(base.getFullYear(), base.getMonth() + parseInt(ms.dataset.miniStep, 10), 1);
      renderMini();
      return;
    }
    const mc = e.target.closest('[data-mini]');
    if (mc) {
      const d = parseYmd(mc.dataset.mini);

      weekStart = ws;

    }

    if (day) openEditor(day.dataset.date);
  });

  bindSwipe(document.getElementById('calBook'), stepMonth);
  bindSwipe(document.getElementById('weekBook'), stepWeek);

  // 검색
  const searchInput = document.getElementById('searchInput');
  searchInput.addEventListener('input', (e) => {
    currentSearch = e.target.value;
    renderSearch();
  });
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); searchInput.blur(); }
  });
  document.getElementById('searchClear').addEventListener('click', () => {
    searchInput.value = '';
    currentSearch = '';
    renderSearch();
    searchInput.focus();
  });
  const onResult = (e) => {
    const r = e.target.closest('.sresult');
    if (r) openEditor(r.dataset.date);
  };
  document.getElementById('searchList').addEventListener('click', onResult);
  // PC: 결과에 마우스를 올리거나(또는 키보드로 옮기면) 오른쪽 달력이 그 날짜로 바뀐다
  const onResultPoint = (e) => {
    const r = e.target.closest('.sresult');
    if (r && isPcLayout() && r.dataset.date !== sCalShown) renderSearchCal(r.dataset.date, true);
  };
  document.getElementById('searchList').addEventListener('mouseover', onResultPoint);
  document.getElementById('searchList').addEventListener('focusin', onResultPoint);

  // Editor
  document.getElementById('editorCancel').addEventListener('click', () => closeTop());
  document.getElementById('editorSave').addEventListener('click', trySave);
  document.getElementById('editorDelete').addEventListener('click', () => {
    if (editingDate && entries[editingDate]) askConfirm('delete');
  });

  // Auto-numbering & bullet in textarea
  // 모바일 소프트키보드는 keydown의 e.key가 신뢰되지 않으므로
  // 스페이스/엔터 트리거는 beforeinput/input 이벤트로도 처리한다.
  const editorText = document.getElementById('editorText');

  // 커서가 있는 줄이 화면에 보이도록 textarea 스크롤을 맞춘다.
  function scrollCursorIntoView(ta) {
    const style = window.getComputedStyle(ta);
    const lineHeight = parseFloat(style.lineHeight) || parseFloat(style.fontSize) * 1.5;
    const paddingTop = parseFloat(style.paddingTop) || 0;
    const pos = ta.selectionStart;
    const textBefore = ta.value.substring(0, pos);
    const linesBefore = textBefore.split('\n').length;
    const cursorY = paddingTop + (linesBefore - 1) * lineHeight;
    const visibleBottom = ta.scrollTop + ta.clientHeight;
    if (cursorY + lineHeight > visibleBottom) {
      ta.scrollTop = cursorY + lineHeight - ta.clientHeight + lineHeight;
    } else if (cursorY < ta.scrollTop) {
      ta.scrollTop = cursorY - paddingTop;
    }
  }

  // ── aimemo 방식 자동 넘버링 (keydown + beforeinput + input) ──
  function setupAutoList(ta) {
    let mode = null; // null | 'bullet' | 'number'

    // ZWS: Android IME가 번호 prefix 숫자를 조합 버퍼로 잡는 것을 방지
    const ZWS = '\u200b';

    function handleSpace(preventFn) {
      const start = ta.selectionStart;
      const before = ta.value.substring(0, start);
      const lines = before.split('\n');
      const curLine = lines[lines.length - 1];

      const numMatch = curLine.match(/^(\d+)\.$/);
      if (numMatch && mode !== 'number') {
        preventFn();
        const lineStart = before.lastIndexOf('\n') + 1;
        ta.value = ta.value.substring(0, lineStart) + numMatch[1] + '. ' + ZWS + ta.value.substring(start);
        const newCursor = lineStart + numMatch[1].length + 2 + 1;
        ta.selectionStart = ta.selectionEnd = newCursor;
        mode = 'number';
        scrollCursorIntoView(ta);
        return true;
      }
      if (curLine === '*' && mode !== 'bullet') {
        preventFn();
        const lineStart = before.lastIndexOf('\n') + 1;
        ta.value = ta.value.substring(0, lineStart) + '• ' + ta.value.substring(start);
        ta.selectionStart = ta.selectionEnd = lineStart + 2;
        mode = 'bullet';
        scrollCursorIntoView(ta);
        return true;
      }
      return false;
    }

    function handleEnter(preventFn, isShift) {
      if (!mode) return false;
      // Shift+Enter → 번호 없이 일반 줄바꿈
      if (isShift) {
        preventFn();
        const start = ta.selectionStart;
        const before = ta.value.substring(0, start);
        const after = ta.value.substring(ta.selectionEnd);
        ta.value = before + '\n' + after;
        ta.selectionStart = ta.selectionEnd = start + 1;
        scrollCursorIntoView(ta);
        return true;
      }
      preventFn();
      const start = ta.selectionStart;
      const before = ta.value.substring(0, start);
      const after = ta.value.substring(ta.selectionEnd);
      const lines = before.split('\n');
      const curLine = lines[lines.length - 1];

      if (mode === 'bullet') {
        if (curLine === '• ') {
          ta.value = before.slice(0, -2) + '\n' + after;
          ta.selectionStart = ta.selectionEnd = start - 2 + 1;
          mode = null;
          return true;
        }
        const insert = '\n• ';
        ta.value = before + insert + after;
        ta.selectionStart = ta.selectionEnd = start + insert.length;

      } else if (mode === 'number') {
        const match = curLine.match(/^(\d+)\.\s/);
        // 빈 번호 줄에서 엔터 → 모드 해제 (ZWS 포함 실제 길이로 제거)
        if (match && curLine.replace(/\u200b/g, '') === match[0]) {
          const trim = before.slice(0, -curLine.length);
          ta.value = trim + '\n' + after;
          ta.selectionStart = ta.selectionEnd = trim.length + 1;
          mode = null;
          return true;
        }
        const nextNum = match ? parseInt(match[1]) + 1 : 1;
        const insert = '\n' + nextNum + '. ' + ZWS;
        // 커서 뒤 번호 줄 재정렬
        const afterLines = after.split('\n');
        let renumFrom = nextNum + 1;
        let inSameBlock = true; // 같은 그룹 내에서만 재번호
        const renumberedAfter = afterLines.map((line, idx) => {
          if (idx === 0) return line;
          const cleanLine = line.replace(/\u200b/g, '');
          const lm = cleanLine.match(/^(\d+)(\.\s)/);
          if (lm && inSameBlock) {
            return renumFrom++ + lm[2] + line.slice(lm[0].length);
          }
          // 번호 줄이 아닌 줄(빈 줄, 일반 텍스트)을 만나면 그룹 끊김 → 이후는 건드리지 않음
          if (!lm) inSameBlock = false;
          return line;
        }).join('\n');
        ta.value = before + insert + renumberedAfter;
        ta.selectionStart = ta.selectionEnd = start + insert.length;
      }
      scrollCursorIntoView(ta);
      return true;
    }

    function renumberAll() {
      const pos = ta.selectionStart;
      const lines = ta.value.split('\n');
      let inBlock = false, blockStart = 0, blockOffset = 0, changed = false;
      const result = lines.map(line => {
        const cleanLine = line.replace(/\u200b/g, '');
        const m = cleanLine.match(/^(\d+)(\.\s)([\s\S]*)$/);
        if (m) {
          if (!inBlock) {
            inBlock = true;
            blockStart = parseInt(m[1], 10);
            blockOffset = 0;
          }
          const expected = blockStart + blockOffset++;
          const oldPrefix = m[1] + m[2];
          const newPrefix = expected + m[2];
          if (oldPrefix === newPrefix) return line;
          const newLine = newPrefix + line.slice(oldPrefix.length);
          changed = true;
          return newLine;
        } else {
          inBlock = false;
          return line;
        }
      });
      if (!changed) return;
      const oldLines = lines, newLines = result;
      let oldOffset = 0, newOffset = 0;
      for (let i = 0; i < oldLines.length; i++) {
        const oldEnd = oldOffset + oldLines[i].length + (i < oldLines.length - 1 ? 1 : 0);
        const newEnd = newOffset + newLines[i].length + (i < newLines.length - 1 ? 1 : 0);
        if (pos <= oldEnd) {
          const posInLine = pos - oldOffset;
          const om = oldLines[i].match(/^(\d+\.\s)/);
          const nm = newLines[i].match(/^(\d+\.\s)/);
          const diff = nm && om ? nm[1].length - om[1].length : 0;
          const newPos = newOffset + Math.max(nm ? nm[1].length : 0, posInLine + diff);
          ta.value = newLines.join('\n');
          ta.selectionStart = ta.selectionEnd = newPos;
          return;
        }
        oldOffset = oldEnd;
        newOffset = newEnd;
      }
      ta.value = newLines.join('\n');
      ta.selectionStart = ta.selectionEnd = pos;
    }

    // PC: keydown
    ta.addEventListener('keydown', function(e) {
      let handled = false;
      if (e.key === ' ') {
        handled = handleSpace(() => e.preventDefault());
      } else if (e.key === 'Enter') {
        handled = handleEnter(() => e.preventDefault(), e.shiftKey);
      }
      if (handled) requestAnimationFrame(() => scrollCursorIntoView(ta));
    });

    // 모바일: beforeinput
    ta.addEventListener('beforeinput', function(e) {
      let handled = false;
      if (e.inputType === 'insertText' && e.data === ' ') {
        handled = handleSpace(() => e.preventDefault());
      } else if (e.inputType === 'insertLineBreak' ||
                 (e.inputType === 'insertText' && e.data === '\n')) {
        handled = handleEnter(() => e.preventDefault(), false);
      }
      if (handled) requestAnimationFrame(() => scrollCursorIntoView(ta));
    });

    // input: updateEditorLinks + 삭제 후 재번호 + 모드 리셋
    ta.addEventListener('input', function(e) {
      updateEditorLinks();
      if (ta.value === '') { mode = null; return; }
      if (mode === 'number' && !e.isComposing) renumberAll();
      scrollCursorIntoView(ta);
    });

    return () => { mode = null; };
  }
  const resetTextMode = setupAutoList(editorText);
  resetListMode = () => { resetTextMode(); };

  // PC: Ctrl/Cmd + Enter → 저장
  editorText.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !e.isComposing) {
      e.preventDefault();
      trySave();
    }
  });

  // Confirm modal
  document.getElementById('confirmCancel').addEventListener('click', () => closeTop());
  document.getElementById('confirmOk').addEventListener('click', doConfirm);

  // PC: Esc → 맨 위 층 닫기, ←/→ → 달·주 넘기기
  document.addEventListener('keydown', (e) => {
    if (e.isComposing) return;
    if (document.getElementById('login-overlay').classList.contains('active')) return;
    if (e.key === 'Escape') {
      if (layers.length > 0) { e.preventDefault(); closeTop(); }
      return;
    }
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    const dir = e.key === 'ArrowRight' ? 1 : -1;
    if (layers.length === 0) { e.preventDefault(); stepMonth(dir); }
    else if (topLayer() === 'week') { e.preventDefault(); stepWeek(dir); }
  });

  bindOverlayClicks();
}

/* ---------- Init ---------- */
bindEvents();

// PIN 입력: 6자리 자동 로그인 / Enter
const pinEl = document.getElementById('pin-input');
pinEl.addEventListener('input', (e) => { if (e.target.value.length === PIN_LEN) doLogin(); });
pinEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });

// 캐시 데이터 우선 렌더
loadCache();
showView('cal');
renderCalendar();

// 저장된 키가 있으면 자동 로그인 (키는 로그아웃 전까지 영구)
if (getAK()) {
  document.getElementById('login-overlay').classList.remove('active');
  syncNow();
} else {
  setTimeout(() => pinEl.focus(), 50);
}

// 다른 기기에서 쓴 내용을 받아오기: 앱으로 돌아올 때 / 네트워크가 다시 연결될 때
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || !getAK()) return;
  if (Date.now() - lastPullAt < 2000) return;
  syncNow();
});
window.addEventListener('online', () => { if (getAK()) syncNow(); });
window.addEventListener('pageshow', (e) => { if (e.persisted && getAK()) syncNow(); });

// 화면 폭이 바뀌면(회전, 창 크기) 검색 결과 배치를 다시 그린다
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(() => fitOneLine(document.getElementById('weekTitle')));
}
let _wasPc = isPcLayout();
window.addEventListener('resize', () => {
  fitOneLine(document.getElementById('weekTitle'));
  const now = isPcLayout();
  if (now !== _wasPc) { _wasPc = now; renderAll(); }
});

// 날짜가 바뀌면 '오늘' 표시를 갱신한다
let _todayKey = todayKey();
setInterval(() => {
  const k = todayKey();
  if (k !== _todayKey) { _todayKey = k; renderAll(); }
}, 60000);

// 키보드가 올라오면 모달을 '키보드 위에 실제로 보이는 영역'에 맞춘다.
// (키보드 높이만큼 아래 여백을 두던 방식은 기기에 따라 빈 공간이 생기고 입력칸이 4줄로 줄었음)
// 브라우저가 화면 높이를 줄이는 방식/줄이지 않는 방식 모두에서 작동하도록,
// 키보드 없을 때의 높이(_baseH)와 지금 보이는 높이를 비교해 판단한다.
if (window.visualViewport) {
  let _baseH = window.innerHeight;
  const onViewport = function() {
    const vv = window.visualViewport;
    if (window.innerHeight > _baseH) _baseH = window.innerHeight;
    const kbOpen = (_baseH - vv.height) > 120;
    document.body.classList.toggle('kb-open', kbOpen);
    document.querySelectorAll('.modal-overlay').forEach(ov => {
      if (kbOpen) {
        ov.style.top = vv.offsetTop + 'px';
        ov.style.height = vv.height + 'px';
        ov.style.bottom = 'auto';
      } else {
        ov.style.top = ''; ov.style.height = ''; ov.style.bottom = '';
      }
    });
    document.querySelectorAll('.sheet').forEach(sheet => {
      sheet.style.paddingBottom = '';
      sheet.style.maxHeight = kbOpen ? (vv.height - 24) + 'px' : '';
    });
  };
  window.visualViewport.addEventListener('resize', onViewport);
  window.visualViewport.addEventListener('scroll', onViewport);
  // 화면 회전 시 기준 높이를 새로 잡는다
  window.addEventListener('orientationchange', () => {
    setTimeout(() => { _baseH = window.innerHeight; onViewport(); }, 400);
  });
}
</script>
</body>
</html>
