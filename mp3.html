<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Player</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #e8f4fd;
    --surface: #ffffff;
    --surface2: #d0eaf9;
    --border: rgba(100,170,230,0.25);
    --accent: #2196f3;
    --accent-light: #64b5f6;
    --accent-dim: rgba(33,150,243,0.12);
    --text: #1a3a5c;
    --text-sub: #4a7099;
    --text-muted: #8ab0cc;
    --radius: 12px;
    --player-h: 96px;
    --sidebar-w: 300px;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 14px;
    overflow: hidden;
  }

  /* ── PC Wrapper ── */
  .app-wrapper {
    max-width: 900px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 40px rgba(33,150,243,0.12);
  }

  .app {
    display: grid;
    grid-template-rows: 1fr var(--player-h);
    grid-template-columns: var(--sidebar-w) 1fr;
    flex: 1;
    min-height: 0;
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    margin: 12px 12px 0;
    border: 1px solid var(--border);
  }

  /* ── Sidebar ── */
  .sidebar {
    grid-row: 1 / 2;
    grid-column: 1 / 2;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    overflow: hidden;
    background: var(--surface);
  }

  .tab-nav {
    display: flex;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--surface2);
  }
  .tab-btn {
    flex: 1;
    padding: 10px 8px;
    font-size: 12px;
    font-weight: 600;
    border: none;
    background: none;
    cursor: pointer;
    color: var(--text-muted);
    transition: color 0.15s, background 0.15s;
    position: relative;
  }
  .tab-btn.active { color: var(--accent); background: var(--surface); }
  .tab-btn.active::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    border-radius: 2px 2px 0 0;
  }

  .tab-panel { display: none; flex-direction: column; flex: 1; min-height: 0; }
  .tab-panel.active { display: flex; }

  .panel-header {
    padding: 10px 12px 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    gap: 6px;
  }
  .panel-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn-icon {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-sub);
    padding: 5px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, color 0.15s;
  }
  .btn-icon:hover { background: var(--accent-dim); color: var(--accent); }
  .btn-icon svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .add-bar {
    padding: 8px 10px;
    display: flex;
    gap: 6px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .add-btn {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text-sub);
    font-size: 12px;
    padding: 6px 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    font-weight: 500;
  }
  .add-btn:hover { background: var(--accent-dim); color: var(--accent); border-color: rgba(33,150,243,0.3); }
  .add-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  #fileInput, #folderInput { display: none; }

  .drop-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(33,150,243,0.1);
    border: 2px dashed var(--accent);
    border-radius: 12px;
    z-index: 50;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    pointer-events: none;
  }
  .drop-overlay.active { display: flex; }

  .track-list {
    flex: 1;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--surface2) transparent;
  }
  .track-list::-webkit-scrollbar { width: 4px; }
  .track-list::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 2px; }

  .list-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 10px;
    color: var(--text-muted);
    font-size: 13px;
    text-align: center;
    padding: 24px;
    line-height: 1.6;
  }
  .list-empty svg { width: 36px; height: 36px; stroke: var(--text-muted); fill: none; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; opacity: 0.5; }

  .track-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 10px;
    cursor: pointer;
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
    position: relative;
    user-select: none;
  }
  .track-item:hover { background: var(--accent-dim); }
  .track-item.active { background: rgba(33,150,243,0.18); }
  .track-item.active .track-name { color: var(--accent); font-weight: 600; }
  .track-item.dragging { opacity: 0.4; background: var(--surface2); }
  .track-item.drag-over { border-top: 2px solid var(--accent); }

  .drag-handle {
    color: var(--text-muted);
    cursor: grab;
    padding: 2px 3px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
  }
  .drag-handle:active { cursor: grabbing; }
  .drag-handle svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

  .track-num {
    width: 20px;
    text-align: center;
    font-size: 11px;
    color: var(--text-muted);
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .track-item.active .track-num { display: none; }
  .track-play-icon {
    display: none;
    width: 20px;
    flex-shrink: 0;
    align-items: center;
    justify-content: center;
    color: var(--accent);
  }
  .track-item.active .track-play-icon { display: flex; }

  .track-info { flex: 1; min-width: 0; }
  .track-name {
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }
  .track-duration {
    font-size: 11px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    margin-top: 1px;
  }

  .track-actions {
    display: flex;
    gap: 2px;
    opacity: 0;
    transition: opacity 0.15s;
    flex-shrink: 0;
  }
  .track-item:hover .track-actions { opacity: 1; }

  .track-act-btn {
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-muted);
    padding: 3px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    transition: color 0.1s, background 0.1s;
  }
  .track-act-btn:hover { color: var(--accent); background: var(--accent-dim); }
  .track-act-btn.remove:hover { color: #f44336; background: rgba(244,67,54,0.1); }
  .track-act-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

  /* Playlist top bar */
  .pl-top-bar {
    display: flex;
    gap: 6px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    align-items: center;
  }
  .pl-select {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 12px;
    padding: 5px 9px;
    outline: none;
    cursor: pointer;
  }
  .pl-new-btn {
    background: var(--accent-dim);
    border: 1px solid rgba(33,150,243,0.3);
    border-radius: 6px;
    color: var(--accent);
    font-size: 11px;
    font-weight: 600;
    padding: 5px 10px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .pl-new-btn:hover { background: var(--accent); color: #fff; }

  /* Playlist add-tracks bar */
  .pl-add-bar {
    display: flex;
    gap: 6px;
    padding: 6px 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    align-items: center;
    background: rgba(33,150,243,0.05);
  }
  .pl-add-select {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 12px;
    padding: 5px 9px;
    outline: none;
    cursor: pointer;
    min-width: 0;
  }
  .pl-add-track-btn {
    background: var(--accent);
    border: none;
    border-radius: 6px;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    padding: 5px 10px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s;
    flex-shrink: 0;
  }
  .pl-add-track-btn:hover { background: var(--accent-light); }

  .count-badge {
    font-size: 11px;
    color: var(--text-muted);
    background: var(--surface2);
    padding: 2px 7px;
    border-radius: 10px;
    font-weight: 600;
  }

  /* ── Main area ── */
  .main {
    grid-row: 1 / 2;
    grid-column: 2 / 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    gap: 20px;
    background: linear-gradient(160deg, #f0f8ff 0%, #e1f0fb 100%);
  }

  .now-playing-art {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: var(--surface);
    border: 3px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    box-shadow: 0 8px 32px rgba(33,150,243,0.2);
  }
  .now-playing-art svg { width: 44px; height: 44px; stroke: var(--text-muted); fill: none; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
  .art-spin {
    position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, #bbdefb, #e3f2fd, #90caf9, #bbdefb);
    animation: spin 8s linear infinite; display: none;
  }
  .art-spin.playing { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .art-center {
    position: absolute; inset: 0; display: flex;
    align-items: center; justify-content: center; z-index: 1;
  }
  .art-center .dot {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--surface); display: flex;
    align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(33,150,243,0.15);
  }
  .art-center .dot svg { width: 20px; height: 20px; }

  .now-info { text-align: center; max-width: 320px; width: 100%; }
  .now-title { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; color: var(--text); }
  .now-idle { color: var(--text-muted); font-size: 14px; font-weight: 400; }

  .visualizer {
    display: flex; align-items: flex-end; gap: 3px;
    height: 24px; margin-top: 6px; justify-content: center;
  }
  .vis-bar {
    width: 3px; background: var(--accent-light); border-radius: 2px;
    opacity: 0.6; animation: none; height: 4px; transition: height 0.1s;
  }
  .visualizer.playing .vis-bar { animation: bounce var(--d, 0.8s) ease-in-out infinite alternate; }
  @keyframes bounce { from { height: 4px; } to { height: var(--h, 20px); } }

  .source-indicator {
    font-size: 11px; color: var(--accent);
    background: var(--accent-dim); padding: 3px 10px;
    border-radius: 10px; text-align: center;
  }

  /* ── Player Bar ── */
  .player-bar {
    grid-row: 2 / 3; grid-column: 1 / 3;
    display: flex; align-items: center; gap: 14px;
    padding: 0 20px; background: var(--surface);
    border-top: 1px solid var(--border);
    box-shadow: 0 -2px 12px rgba(33,150,243,0.08);
  }

  .progress-section { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .seek-row { display: flex; align-items: center; gap: 8px; }
  .time-label { font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; width: 34px; flex-shrink: 0; }
  .time-label.end { text-align: right; }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    background: transparent; cursor: pointer; flex: 1; height: 16px; margin: 0;
  }
  input[type=range]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: var(--surface2); }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%;
    background: var(--accent); margin-top: -5px; transition: transform 0.1s;
    box-shadow: 0 1px 4px rgba(33,150,243,0.4);
  }
  input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.3); }
  input[type=range]::-moz-range-track { height: 3px; border-radius: 2px; background: var(--surface2); }
  input[type=range]::-moz-range-thumb { width: 13px; height: 13px; border-radius: 50%; background: var(--accent); border: none; }

  .ctrl-btn {
    background: none; border: none; cursor: pointer; color: var(--text-sub);
    padding: 6px; border-radius: 8px; display: flex; align-items: center;
    justify-content: center; transition: color 0.15s, background 0.15s;
  }
  .ctrl-btn:hover { color: var(--accent); background: var(--accent-dim); }
  .ctrl-btn.active { color: var(--accent); }
  .ctrl-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .play-btn {
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--accent); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: #fff; transition: transform 0.1s, background 0.15s;
    flex-shrink: 0; box-shadow: 0 4px 16px rgba(33,150,243,0.35);
  }
  .play-btn:hover { transform: scale(1.07); background: var(--accent-light); }
  .play-btn:active { transform: scale(0.95); }
  .play-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: currentColor; stroke-width: 1.5; }

  .right-controls { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .speed-btn {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text-sub); font-size: 11px; font-weight: 700;
    padding: 4px 8px; cursor: pointer; transition: background 0.15s, color 0.15s;
    font-variant-numeric: tabular-nums;
  }
  .speed-btn:hover { background: var(--accent-dim); color: var(--accent); }
  .speed-btn.active { background: var(--accent-dim); color: var(--accent); }
  .volume-wrap { display: flex; align-items: center; gap: 5px; }
  .volume-wrap input[type=range] { width: 66px; }

  @keyframes marquee {
    0%, 15% { transform: translateX(0); }
    85%, 100% { transform: translateX(var(--scroll-x, -100px)); }
  }
  .marquee-wrap { overflow: hidden; }
  .marquee-inner { display: inline-block; white-space: nowrap; }
  .marquee-inner.scrolling { animation: marquee 6s linear infinite; }

  .kb-hint { font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 4px; }
  kbd { background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; padding: 1px 5px; font-size: 10px; font-family: inherit; color: var(--text-sub); }

  /* ═══════════════════════════
     MODAL
  ═══════════════════════════ */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(26,58,92,0.35);
    z-index: 200;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.18s;
  }
  .modal-backdrop.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--surface);
    border-radius: 14px;
    box-shadow: 0 16px 48px rgba(33,150,243,0.2);
    width: 360px;
    max-width: calc(100vw - 32px);
    overflow: hidden;
    transform: translateY(12px);
    transition: transform 0.18s;
  }
  .modal-backdrop.open .modal { transform: translateY(0); }

  .modal-header {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-title { font-size: 15px; font-weight: 700; color: var(--text); }
  .modal-close {
    background: none; border: none; cursor: pointer;
    color: var(--text-muted); padding: 4px; border-radius: 6px;
    display: flex; align-items: center; transition: color 0.15s;
  }
  .modal-close:hover { color: var(--text); }
  .modal-close svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

  .modal-body { padding: 16px 20px; }
  .modal-label { font-size: 12px; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; display: block; }
  .modal-input {
    width: 100%;
    background: var(--surface2); border: 1.5px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 14px;
    padding: 9px 12px; outline: none;
    transition: border-color 0.15s;
    font-family: inherit;
  }
  .modal-input:focus { border-color: var(--accent); }

  .modal-footer {
    padding: 12px 20px 16px;
    display: flex; gap: 8px; justify-content: flex-end;
  }
  .modal-btn {
    padding: 8px 18px; border-radius: 8px; font-size: 13px;
    font-weight: 600; cursor: pointer; border: none;
    transition: background 0.15s, color 0.15s;
  }
  .modal-btn.cancel {
    background: var(--surface2); color: var(--text-sub);
  }
  .modal-btn.cancel:hover { background: var(--border); color: var(--text); }
  .modal-btn.confirm {
    background: var(--accent); color: #fff;
  }
  .modal-btn.confirm:hover { background: var(--accent-light); }
  .modal-btn.danger { background: rgba(244,67,54,0.1); color: #f44336; }
  .modal-btn.danger:hover { background: #f44336; color: #fff; }

  /* Confirm modal message */
  .modal-msg { font-size: 14px; color: var(--text-sub); line-height: 1.6; }

  /* Context menu */
  .ctx-menu {
    position: fixed; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(33,150,243,0.15);
    z-index: 300; min-width: 160px; overflow: hidden; display: none;
  }
  .ctx-menu.open { display: block; }
  .ctx-item {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 14px; font-size: 13px; color: var(--text-sub);
    cursor: pointer; transition: background 0.1s, color 0.1s;
  }
  .ctx-item:hover { background: var(--accent-dim); color: var(--accent); }
  .ctx-item svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
  .ctx-label { padding: 7px 14px 4px; font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
</style>
</head>
<body>

<div class="drop-overlay" id="dropOverlay">🎵 파일을 여기에 놓으세요</div>
<div class="ctx-menu" id="ctxMenu"></div>

<!-- Modal -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">제목</span>
      <button class="modal-close" id="modalClose">
        <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<div class="app-wrapper">
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="tab-nav">
      <button class="tab-btn active" id="tabQueue" onclick="switchTab('queue')">재생목록</button>
      <button class="tab-btn" id="tabPl" onclick="switchTab('playlist')">플레이리스트</button>
    </div>

    <!-- Queue Panel -->
    <div class="tab-panel active" id="panelQueue">
      <div class="panel-header">
        <span class="panel-title">현재 목록 <span class="count-badge" id="queueBadge">0</span></span>
        <div style="display:flex;gap:3px;">
          <button class="btn-icon" id="btnShuffle2" title="셔플">
            <svg viewBox="0 0 24 24"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/></svg>
          </button>
          <button class="btn-icon" id="btnClearAll" title="전체 삭제">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>

<audio id="audio"></audio>

<script>
// ═══════════════════════════════════════
// STATE
// ═══════════════════════════════════════
const audio = document.getElementById('audio');
let queue = [];
let currentIndex = -1;
let currentSource = 'queue';
let activePlaylistId = null;
let shuffle = false;
let repeatMode = 0;
let shuffledOrder = [];
const speeds = [0.5, 0.75, 1, 1.25, 1.5, 1.75, 2];
let speedIdx = 2;
let savedVol = 1;
let playlists = [];
let currentPlId = null;

// ═══════════════════════════════════════
// DOM
// ═══════════════════════════════════════
const queueItems      = document.getElementById('queueItems');
const queueEmpty      = document.getElementById('queueEmpty');
const queueBadge      = document.getElementById('queueBadge');
const plItems         = document.getElementById('plItems');
const plEmpty         = document.getElementById('plEmpty');
const plSelect        = document.getElementById('plSelect');
const plHeader        = document.getElementById('plHeader');
const plTitle         = document.getElementById('plTitle');
const plAddBar        = document.getElementById('plAddBar');
const plAddSelect     = document.getElementById('plAddSelect');
const nowTitleText    = document.getElementById('nowTitleText');
const nowTitleInner   = document.getElementById('nowTitle');
const seekBar         = document.getElementById('seekBar');
const volBar          = document.getElementById('volBar');
const timeElapsed     = document.getElementById('timeElapsed');
const timeTotal       = document.getElementById('timeTotal');
const btnPlay         = document.getElementById('btnPlay');
const playIcon        = document.getElementById('playIcon');
const btnShuffle      = document.getElementById('btnShuffle');
const btnShuffle2     = document.getElementById('btnShuffle2');
const btnRepeat       = document.getElementById('btnRepeat');
const btnSpeed        = document.getElementById('btnSpeed');
const btnMute         = document.getElementById('btnMute');
const volIcon         = document.getElementById('volIcon');
const artSpin         = document.getElementById('artSpin');
const visualizer      = document.getElementById('visualizer');
const sourceIndicator = document.getElementById('sourceIndicator');

// ═══════════════════════════════════════
// MODAL SYSTEM
// ═══════════════════════════════════════
const modalBackdrop = document.getElementById('modalBackdrop');
const modalTitle    = document.getElementById('modalTitle');
const modalBody     = document.getElementById('modalBody');
const modalFooter   = document.getElementById('modalFooter');
let modalCallback   = null;

function openModal({ title, body, buttons }) {
  modalTitle.textContent = title;
  modalBody.innerHTML = body;
  modalFooter.innerHTML = '';
  buttons.forEach(btn => {
    const el = document.createElement('button');
    el.className = 'modal-btn ' + (btn.cls || 'confirm');
    el.textContent = btn.label;
    el.addEventListener('click', () => { closeModal(); btn.action && btn.action(); });
    modalFooter.appendChild(el);
  });
  modalBackdrop.classList.add('open');
  // push history state so back button closes modal
  history.pushState({ modal: true }, '');
  // focus first input if any
  const inp = modalBody.querySelector('input');
  if (inp) setTimeout(() => inp.focus(), 50);
}

function closeModal() {
  modalBackdrop.classList.remove('open');
  // remove the history state if still on it
  if (history.state && history.state.modal) history.back();
}

document.getElementById('modalClose').addEventListener('click', closeModal);
modalBackdrop.addEventListener('click', e => { if (e.target === modalBackdrop) closeModal(); });

// back button closes modal
window.addEventListener('popstate', e => {
  if (modalBackdrop.classList.contains('open')) {
    modalBackdrop.classList.remove('open');
  }
});

// Enter key submits
modalBackdrop.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    const confirm = modalFooter.querySelector('.confirm');
    if (confirm) confirm.click();
  }
  if (e.key === 'Escape') closeModal();
});

// Prompt-style helper
function showPrompt(title, placeholder, defaultVal, onConfirm) {
  openModal({
    title,
    body: `<label class="modal-label">${placeholder}</label>
           <input class="modal-input" id="modalInput" type="text" value="${defaultVal || ''}" placeholder="${placeholder}">`,
    buttons: [
      { label: '취소', cls: 'cancel' },
      { label: '확인', cls: 'confirm', action: () => {
          const val = document.getElementById('modalInput')?.value?.trim();
          if (val) onConfirm(val);
        }
      }
    ]
  });
}

// Confirm-style helper
function showConfirm(title, msg, onConfirm) {
  openModal({
    title,
    body: `<p class="modal-msg">${msg}</p>`,
    buttons: [
      { label: '취소', cls: 'cancel' },
      { label: '삭제', cls: 'danger', action: onConfirm }
    ]
  });
}

// ═══════════════════════════════════════
// VISUALIZER
// ═══════════════════════════════════════
(function(){
  const heights = [8,14,20,16,10,18,24,12,20,14,8,16,22,10,18];
  const delays  = [0,.1,.2,.05,.15,.3,.08,.22,.04,.17,.28,.06,.13,.25,.09];
  heights.forEach((h, i) => {
    const bar = document.createElement('div');
    bar.className = 'vis-bar';
    bar.style.setProperty('--h', h + 'px');
    bar.style.setProperty('--d', (0.5 + delays[i] * 2) + 's');
    bar.style.animationDelay = delays[i] + 's';
    visualizer.appendChild(bar);
  });
})();

// ═══════════════════════════════════════
// UTILS
// ═══════════════════════════════════════
function fmt(sec) {
  if (!isFinite(sec)) return '0:00';
  return Math.floor(sec/60) + ':' + String(Math.floor(sec%60)).padStart(2,'0');
}
function getDisplayName(name) { return name.replace(/\.[^.]+$/, ''); }
function uid() { return Math.random().toString(36).slice(2, 9); }

// ═══════════════════════════════════════
// TABS
// ═══════════════════════════════════════
function switchTab(tab) {
  document.getElementById('tabQueue').classList.toggle('active', tab === 'queue');
  document.getElementById('tabPl').classList.toggle('active', tab === 'playlist');
  document.getElementById('panelQueue').classList.toggle('active', tab === 'queue');
  document.getElementById('panelPlaylist').classList.toggle('active', tab === 'playlist');
}

// ═══════════════════════════════════════
// SHUFFLE
// ═══════════════════════════════════════
function activeList() {
  if (currentSource === 'playlist' && activePlaylistId) {
    const pl = playlists.find(p => p.id === activePlaylistId);
    if (pl) return pl.tracks.map(t => queue.find(q => q.name === t.name && q.size === t.size)).filter(Boolean);
  }
  return queue;
}

function buildShuffleOrder() {
  shuffledOrder = [...Array(activeList().length).keys()];
  for (let i = shuffledOrder.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffledOrder[i], shuffledOrder[j]] = [shuffledOrder[j], shuffledOrder[i]];
  }
}

// ═══════════════════════════════════════
// RENDER QUEUE
// ═══════════════════════════════════════
function renderQueue() {
  queueItems.innerHTML = '';
  queueEmpty.style.display = queue.length ? 'none' : 'flex';
  queueBadge.textContent = queue.length;
  queue.forEach((track, i) => {
    queueItems.appendChild(buildTrackItem(track, i, 'queue', i === currentIndex && currentSource === 'queue'));
  });
  updatePlAddSelect();
  savePersist();
}

// ═══════════════════════════════════════
// RENDER PLAYLIST PANEL
// ═══════════════════════════════════════
function renderPlPanel() {
  // Rebuild select
  const prevVal = plSelect.value;
  plSelect.innerHTML = '<option value="">— 플레이리스트 선택 —</option>';
  playlists.forEach(pl => {
    const opt = document.createElement('option');
    opt.value = pl.id;
    opt.textContent = pl.name + ' (' + pl.tracks.length + '곡)';
    plSelect.appendChild(opt);
  });
  if (prevVal) plSelect.value = prevVal;

  const pl = currentPlId ? playlists.find(p => p.id === currentPlId) : null;
  if (!pl) {
    plHeader.style.display = 'none';
    plAddBar.style.display = 'none';
    plItems.innerHTML = '';
    plEmpty.style.display = 'flex';
    return;
  }

  plHeader.style.display = 'flex';
  plAddBar.style.display = 'flex';
  plTitle.textContent = pl.name;
  plEmpty.style.display = pl.tracks.length ? 'none' : 'flex';
  plItems.innerHTML = '';

  pl.tracks.forEach((track, i) => {
    const qTrack = queue.find(q => q.name === track.name && q.size === track.size);
    const isActive = currentSource === 'playlist' && activePlaylistId === currentPlId &&
                     qTrack && queue.indexOf(qTrack) === currentIndex;
    plItems.appendChild(buildTrackItem(qTrack || track, i, 'playlist', isActive));
  });

  updatePlAddSelect();
  savePersist();
}

// Populate the "add track" dropdown with queue tracks not already in this playlist
function updatePlAddSelect() {
  const pl = currentPlId ? playlists.find(p => p.id === currentPlId) : null;
  plAddSelect.innerHTML = '<option value="">재생목록에서 곡 선택...</option>';
  if (!pl) return;
  queue.forEach((track, i) => {
    if (!pl.tracks.some(t => t.name === track.name && t.size === track.size)) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = getDisplayName(track.name);
      plAddSelect.appendChild(opt);
    }
  });
}

function addSelectedTrackToPlaylist() {
  const idx = parseInt(plAddSelect.value);
  if (isNaN(idx) || idx < 0) return;
  const track = queue[idx];
  if (!track) return;
  addTrackToPlaylist(currentPlId, track);
}

// ═══════════════════════════════════════
// BUILD TRACK ITEM
// ═══════════════════════════════════════
function buildTrackItem(track, i, listType, isActive) {
  const item = document.createElement('div');
  item.className = 'track-item' + (isActive ? ' active' : '');
  item.dataset.index = i;
  item.dataset.list = listType;

  const handle = document.createElement('div');
  handle.className = 'drag-handle';
  handle.innerHTML = `<svg viewBox="0 0 24 24"><line x1="3" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="21" y2="15"/></svg>`;
  handle.draggable = true;

  const numEl = document.createElement('div');
  numEl.className = 'track-num';
  numEl.textContent = i + 1;

  const playIc = document.createElement('div');
  playIc.className = 'track-play-icon';
  playIc.innerHTML = `<svg width="12" height="12" viewBox="0 0 24 24" fill="var(--accent)" stroke="none"><polygon points="5 3 19 12 5 21 5 3"/></svg>`;

  const info = document.createElement('div');
  info.className = 'track-info';
  const nm = document.createElement('div');
  nm.className = 'track-name';
  nm.textContent = getDisplayName(track.name);
  const dur = document.createElement('div');
  dur.className = 'track-duration';
  dur.textContent = track.duration ? fmt(track.duration) : '—';
  info.appendChild(nm);
  info.appendChild(dur);

  const actions = document.createElement('div');
  actions.className = 'track-actions';

  if (listType === 'queue') {
    const rm = document.createElement('button');
    rm.className = 'track-act-btn remove';
    rm.title = '삭제';
    rm.innerHTML = `<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
    rm.addEventListener('click', e => { e.stopPropagation(); removeFromQueue(i); });
    actions.appendChild(rm);
  } else {
    const rm = document.createElement('button');
    rm.className = 'track-act-btn remove';
    rm.title = '목록에서 제거';
    rm.innerHTML = `<svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
    rm.addEventListener('click', e => { e.stopPropagation(); removeFromPlaylist(currentPlId, i); });
    actions.appendChild(rm);
  }

  item.appendChild(handle);
  item.appendChild(numEl);
  item.appendChild(playIc);
  item.appendChild(info);
  item.appendChild(actions);

  item.addEventListener('click', () => {
    if (listType === 'queue') {
      currentSource = 'queue'; activePlaylistId = null;
      updateSourceIndicator(); playTrack(i);
    } else {
      playFromPlaylist(currentPlId, i);
    }
  });

  setupDrag(handle, item, i, listType);
  return item;
}

// ═══════════════════════════════════════
// DRAG REORDER
// ═══════════════════════════════════════
let dragSrcIdx = null;
let dragListType = null;

function setupDrag(handle, item, i, listType) {
  handle.addEventListener('dragstart', e => {
    dragSrcIdx = i; dragListType = listType;
    item.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', i);
  });
  handle.addEventListener('dragend', () => {
    item.classList.remove('dragging');
    document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
  });
  item.addEventListener('dragover', e => {
    if (dragListType !== listType) return;
    e.preventDefault();
    document.querySelectorAll('.track-item').forEach(el => el.classList.remove('drag-over'));
    item.classList.add('drag-over');
  });
  item.addEventListener('drop', e => {
    e.preventDefault();
    if (dragSrcIdx === null || dragSrcIdx === i || dragListType !== listType) return;
    if (listType === 'queue') reorderQueue(dragSrcIdx, i);
    else reorderPlaylist(currentPlId, dragSrcIdx, i);
    dragSrcIdx = null;
  });
}

function reorderQueue(from, to) {
  const moving = currentIndex === from;
  const [item] = queue.splice(from, 1);
  queue.splice(to, 0, item);
  if (moving) currentIndex = to;
  else if (currentIndex > from && currentIndex <= to) currentIndex--;
  else if (currentIndex < from && currentIndex >= to) currentIndex++;
  buildShuffleOrder(); renderQueue();
}

function reorderPlaylist(plId, from, to) {
  const pl = playlists.find(p => p.id === plId);
  if (!pl) return;
  const [item] = pl.tracks.splice(from, 1);
  pl.tracks.splice(to, 0, item);
  renderPlPanel();
}

// ═══════════════════════════════════════
// QUEUE OPERATIONS
// ═══════════════════════════════════════
function addFiles(files) {
  const mp3Types = /\.(mp3|wav|ogg|flac|m4a|aac|opus)$/i;
  Array.from(files).filter(f => mp3Types.test(f.name)).forEach(file => {
    if (queue.some(t => t.name === file.name && t.size === file.size)) return;
    const entry = { name: file.name, size: file.size, file, duration: null, url: null };
    queue.push(entry);
    const tmp = new Audio();
    tmp.src = URL.createObjectURL(file);
    tmp.addEventListener('loadedmetadata', () => {
      entry.duration = tmp.duration;
      renderQueue();
      URL.revokeObjectURL(tmp.src);
    });
  });
  buildShuffleOrder(); renderQueue();
  if (currentIndex === -1 && queue.length > 0) highlightCurrent();
}

function removeFromQueue(i) {
  if (queue[i].url) URL.revokeObjectURL(queue[i].url);
  queue.splice(i, 1);
  if (currentIndex === i) { audio.pause(); currentIndex = -1; setPlayState(false); resetNowPlaying(); }
  else if (currentIndex > i) currentIndex--;
  buildShuffleOrder(); renderQueue();
}

function clearQueue() {
  if (!queue.length) return;
  showConfirm('전체 삭제', '재생목록의 모든 곡을 삭제할까요?', () => {
    audio.pause(); audio.src = '';
    queue.forEach(t => { if (t.url) URL.revokeObjectURL(t.url); });
    queue.length = 0; currentIndex = -1;
    resetNowPlaying(); setPlayState(false); seekBar.value = 0;
    buildShuffleOrder(); renderQueue();
  });
}

function resetNowPlaying() {
  nowTitleText.textContent = '곡을 선택하세요';
  nowTitleText.className = 'now-idle';
  nowTitleInner.classList.remove('scrolling');
  artSpin.classList.remove('playing');
  visualizer.classList.remove('playing');
  timeElapsed.textContent = '0:00';
  timeTotal.textContent = '0:00';
  seekBar.value = 0;
}

// ═══════════════════════════════════════
// PLAYLIST OPERATIONS
// ═══════════════════════════════════════
function newPlaylist() {
  showPrompt('새 플레이리스트', '플레이리스트 이름', '', name => {
    const pl = { id: uid(), name, tracks: [] };
    playlists.push(pl);
    currentPlId = pl.id;
    renderPlPanel();
    plSelect.value = pl.id;
    savePersist();
  });
}

function loadPlaylist() {
  currentPlId = plSelect.value || null;
  renderPlPanel();
}

function renamePlaylist() {
  const pl = playlists.find(p => p.id === currentPlId);
  if (!pl) return;
  showPrompt('플레이리스트 이름 수정', '새 이름', pl.name, name => {
    pl.name = name;
    renderPlPanel();
    savePersist();
  });
}

function deleteCurrentPlaylist() {
  const pl = playlists.find(p => p.id === currentPlId);
  if (!pl) return;
  showConfirm('플레이리스트 삭제', `"${pl.name}"을 삭제할까요?`, () => {
    playlists = playlists.filter(p => p.id !== currentPlId);
    if (activePlaylistId === currentPlId) { activePlaylistId = null; currentSource = 'queue'; updateSourceIndicator(); }
    currentPlId = null;
    plSelect.value = '';
    renderPlPanel();
  });
}

function addTrackToPlaylist(plId, track) {
  const pl = playlists.find(p => p.id === plId);
  if (!pl) return;
  if (pl.tracks.some(t => t.name === track.name && t.size === track.size)) return;
  pl.tracks.push({ name: track.name, size: track.size });
  renderPlPanel();
  savePersist();
}

function removeFromPlaylist(plId, i) {
  const pl = playlists.find(p => p.id === plId);
  if (!pl) return;
  pl.tracks.splice(i, 1);
  renderPlPanel();
}

function playPlaylistNow() {
  const pl = playlists.find(p => p.id === currentPlId);
  if (!pl || !pl.tracks.length) return;
  playFromPlaylist(currentPlId, 0);
}

function playFromPlaylist(plId, plIdx) {
  const pl = playlists.find(p => p.id === plId);
  if (!pl) return;
  const trackRef = pl.tracks[plIdx];
  if (!trackRef) return;
  const qIdx = queue.findIndex(q => q.name === trackRef.name && q.size === trackRef.size);
  if (qIdx === -1) {
    openModal({ title: '파일 없음', body: '<p class="modal-msg">파일이 재생목록에 없습니다.<br>파일을 먼저 추가해주세요.</p>', buttons: [{ label: '확인', cls: 'confirm' }] });
    return;
  }
  currentSource = 'playlist'; activePlaylistId = plId;
  updateSourceIndicator(); buildShuffleOrder(); playTrack(qIdx);
}

// ═══════════════════════════════════════
// PLAYBACK
// ═══════════════════════════════════════
function playTrack(i) {
  if (i < 0 || i >= queue.length) return;
  currentIndex = i;
  const track = queue[i];
  if (!track.url) track.url = URL.createObjectURL(track.file);
  audio.src = track.url;
  audio.playbackRate = speeds[speedIdx];
  audio.play();
  nowTitleText.textContent = getDisplayName(track.name);
  nowTitleText.className = '';
  nowTitleInner.classList.remove('scrolling');
  requestAnimationFrame(() => {
    const wrap = nowTitleInner.parentElement;
    if (nowTitleInner.scrollWidth > wrap.offsetWidth + 4) {
      const diff = nowTitleInner.scrollWidth - wrap.offsetWidth;
      nowTitleInner.style.setProperty('--scroll-x', '-' + diff + 'px');
      nowTitleInner.classList.add('scrolling');
    }
  });
  renderQueue(); renderPlPanel();
}

function highlightCurrent() {
  document.querySelectorAll('.track-item').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.index) === currentIndex && el.dataset.list === currentSource);
  });
}

function setPlayState(playing) {
  const pause = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
  const play  = '<polygon points="5 3 19 12 5 21 5 3"/>';
  playIcon.innerHTML = playing ? pause : play;
  artSpin.classList.toggle('playing', playing);
  visualizer.classList.toggle('playing', playing);
}

function getNextIndex() {
  if (activeList().length === 0) return -1;
  if (shuffle) {
    const pos = shuffledOrder.indexOf(currentIndex);
    return shuffledOrder[(pos + 1) % shuffledOrder.length];
  }
  if (currentSource === 'playlist' && activePlaylistId) {
    const pl = playlists.find(p => p.id === activePlaylistId);
    if (pl) {
      const cur = pl.tracks.findIndex(t => queue[currentIndex] && t.name === queue[currentIndex].name);
      const next = pl.tracks[(cur + 1) % pl.tracks.length];
      return queue.findIndex(q => q.name === next.name && q.size === next.size);
    }
  }
  return (currentIndex + 1) % queue.length;
}

function getPrevIndex() {
  if (activeList().length === 0) return -1;
  if (shuffle) {
    const pos = shuffledOrder.indexOf(currentIndex);
    return shuffledOrder[(pos - 1 + shuffledOrder.length) % shuffledOrder.length];
  }
  if (currentSource === 'playlist' && activePlaylistId) {
    const pl = playlists.find(p => p.id === activePlaylistId);
    if (pl) {
      const cur = pl.tracks.findIndex(t => queue[currentIndex] && t.name === queue[currentIndex].name);
      const prev = pl.tracks[(cur - 1 + pl.tracks.length) % pl.tracks.length];
      return queue.findIndex(q => q.name === prev.name && q.size === prev.size);
    }
  }
  return (currentIndex - 1 + queue.length) % queue.length;
}

function updateSourceIndicator() {
  if (currentSource === 'playlist' && activePlaylistId) {
    const pl = playlists.find(p => p.id === activePlaylistId);
    if (pl) { sourceIndicator.textContent = '🎵 플레이리스트: ' + pl.name; sourceIndicator.style.display = 'block'; return; }
  }
  sourceIndicator.style.display = 'none';
}

// ═══════════════════════════════════════
// AUDIO EVENTS
// ═══════════════════════════════════════
audio.addEventListener('play',  () => setPlayState(true));
audio.addEventListener('pause', () => setPlayState(false));
audio.addEventListener('timeupdate', () => {
  if (!audio.duration) return;
  seekBar.value = (audio.currentTime / audio.duration) * 100;
  timeElapsed.textContent = fmt(audio.currentTime);
  timeTotal.textContent   = fmt(audio.duration);
});
audio.addEventListener('ended', () => {
  if (repeatMode === 2) { audio.currentTime = 0; audio.play(); return; }
  const next = getNextIndex();
  if (repeatMode === 1 || next !== currentIndex) playTrack(next === -1 ? 0 : next);
  else { setPlayState(false); audio.currentTime = 0; seekBar.value = 0; timeElapsed.textContent = '0:00'; }
});

// ═══════════════════════════════════════
// CONTROLS
// ═══════════════════════════════════════
function doPlay() {
  if (!audio.src && queue.length > 0) playTrack(0);
  else if (audio.paused) audio.play();
  else audio.pause();
}
function doPrev() { if (audio.currentTime > 3) { audio.currentTime = 0; return; } if (queue.length) playTrack(getPrevIndex()); }
function doNext() { if (queue.length) playTrack(getNextIndex()); }

btnPlay.addEventListener('click', doPlay);
document.getElementById('btnPrev').addEventListener('click', doPrev);
document.getElementById('btnNext').addEventListener('click', doNext);

function toggleShuffle() {
  shuffle = !shuffle;
  [btnShuffle, btnShuffle2].forEach(b => b.classList.toggle('active', shuffle));
  if (shuffle) buildShuffleOrder();
}
btnShuffle.addEventListener('click', toggleShuffle);
btnShuffle2.addEventListener('click', toggleShuffle);

btnRepeat.addEventListener('click', () => {
  repeatMode = (repeatMode + 1) % 3;
  btnRepeat.classList.toggle('active', repeatMode > 0);
  const svg1 = `<polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>`;
  btnRepeat.querySelector('svg').innerHTML = repeatMode === 2 ? svg1 + `<line x1="12" y1="8" x2="12" y2="16"/>` : svg1;
  btnRepeat.title = ['반복 끔','전체 반복','한 곡 반복'][repeatMode];
});

btnSpeed.addEventListener('click', () => {
  speedIdx = (speedIdx + 1) % speeds.length;
  const s = speeds[speedIdx];
  audio.playbackRate = s;
  btnSpeed.textContent = s === 1 ? '1×' : s + '×';
  btnSpeed.classList.toggle('active', s !== 1);
});

seekBar.addEventListener('input', () => { if (audio.duration) audio.currentTime = (seekBar.value / 100) * audio.duration; });
volBar.addEventListener('input', () => { audio.volume = volBar.value; savedVol = volBar.value; updateVolIcon(); });
btnMute.addEventListener('click', () => {
  if (audio.volume > 0) { savedVol = audio.volume; audio.volume = 0; volBar.value = 0; }
  else { audio.volume = savedVol || 1; volBar.value = audio.volume; }
  updateVolIcon();
});

function updateVolIcon() {
  const v = audio.volume;
  if (v === 0) volIcon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>`;
  else if (v < 0.5) volIcon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>`;
  else volIcon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>`;
}

// ═══════════════════════════════════════
// FILE INPUT & DROP
// ═══════════════════════════════════════
document.getElementById('btnAddFiles').addEventListener('click', () => document.getElementById('fileInput').click());
document.getElementById('btnAddFolder').addEventListener('click', () => document.getElementById('folderInput').click());
document.getElementById('fileInput').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
document.getElementById('folderInput').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
document.getElementById('btnClearAll').addEventListener('click', clearQueue);

const dropOverlay = document.getElementById('dropOverlay');
let dragCounter = 0;
document.addEventListener('dragenter', e => { if (e.dataTransfer.types.includes('Files')) { e.preventDefault(); dragCounter++; dropOverlay.classList.add('active'); } });
document.addEventListener('dragleave', () => { dragCounter--; if (dragCounter <= 0) { dragCounter = 0; dropOverlay.classList.remove('active'); } });
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => { e.preventDefault(); dragCounter = 0; dropOverlay.classList.remove('active'); if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });

// ═══════════════════════════════════════
// KEYBOARD
// ═══════════════════════════════════════
document.addEventListener('keydown', e => {
  if (['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)) return;
  switch(e.code) {
    case 'Space': e.preventDefault(); doPlay(); break;
    case 'ArrowLeft': e.preventDefault(); if (e.shiftKey) doPrev(); else audio.currentTime = Math.max(0, audio.currentTime - 5); break;
    case 'ArrowRight': e.preventDefault(); if (e.shiftKey) doNext(); else audio.currentTime = Math.min(audio.duration||0, audio.currentTime + 5); break;
    case 'KeyM': btnMute.click(); break;
  }
});

// ═══════════════════════════════════════
// PERSIST
// ═══════════════════════════════════════
function savePersist() {
  try {
    localStorage.setItem('mp3player_v3', JSON.stringify({
      queue: queue.map(t => ({ name: t.name, size: t.size, duration: t.duration })),
      playlists, currentIndex, currentSource, activePlaylistId
    }));
  } catch(e) {}
}

function loadPersist() {
  try {
    const raw = localStorage.getItem('mp3player_v3');
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.playlists) playlists = data.playlists;
  } catch(e) {}
}

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
loadPersist();
renderQueue();
renderPlPanel();
updateVolIcon();
</script>
</body>
</html>
