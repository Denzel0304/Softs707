<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Sending E-mail</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #000;
    color: #00ff41;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 20px;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0, 255, 65, 0.03) 2px,
      rgba(0, 255, 65, 0.03) 4px
    );
    pointer-events: none;
    z-index: 0;
  }

  .container {
    width: 100%;
    max-width: 400px;
    position: relative;
    z-index: 1;
  }

  .header {
    text-align: center;
    margin-bottom: 40px;
  }

  .title {
    font-family: 'Orbitron', monospace;
    font-size: 22px;
    font-weight: 700;
    color: #00ff41;
    letter-spacing: 3px;
    text-shadow: 0 0 20px rgba(0, 255, 65, 0.8);
    margin-bottom: 8px;
  }

  .subtitle {
    font-size: 11px;
    color: #005c1a;
    letter-spacing: 2px;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 12px 0 32px;
  }

  .divider-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, #00ff41, transparent);
    opacity: 0.4;
  }

  .divider-dot {
    width: 4px;
    height: 4px;
    background: #00ff41;
    border-radius: 50%;
    box-shadow: 0 0 6px #00ff41;
  }

  .card {
    border: 1px solid rgba(0, 255, 65, 0.3);
    border-radius: 4px;
    padding: 28px 24px;
    background: rgba(0, 255, 65, 0.03);
    position: relative;
  }

  .card::before {
    content: '';
    position: absolute;
    top: -1px; left: 20px; right: 20px;
    height: 1px;
    background: linear-gradient(to right, transparent, #00ff41, transparent);
  }

  .corner {
    position: absolute;
    width: 12px;
    height: 12px;
    border-color: #00ff41;
    border-style: solid;
    opacity: 0.8;
  }
  .corner-tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .corner-tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
  .corner-bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
  .corner-br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

  .label {
    font-size: 11px;
    color: #008f24;
    letter-spacing: 2px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .label::before {
    content: '>';
    color: #00ff41;
    font-size: 13px;
  }

  .field-group {
    margin-bottom: 20px;
  }

  input[type="password"],
  input[type="email"] {
    width: 100%;
    background: rgba(0, 255, 65, 0.05);
    border: 1px solid rgba(0, 255, 65, 0.3);
    border-radius: 3px;
    color: #00ff41;
    font-family: 'Share Tech Mono', monospace;
    font-size: 15px;
    padding: 14px 16px;
    outline: none;
    transition: all 0.2s;
    letter-spacing: 1px;
  }

  input[type="password"]::placeholder,
  input[type="email"]::placeholder {
    color: rgba(0, 255, 65, 0.2);
    font-size: 13px;
  }

  input[type="password"]:focus,
  input[type="email"]:focus {
    border-color: #00ff41;
    background: rgba(0, 255, 65, 0.08);
    box-shadow: 0 0 16px rgba(0, 255, 65, 0.2), inset 0 0 8px rgba(0, 255, 65, 0.05);
  }

  input:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .error-msg {
    font-size: 11px;
    color: #ff3131;
    letter-spacing: 1px;
    margin-top: 8px;
    display: none;
  }

  .error-msg.show { display: block; }

  .btn {
    width: 100%;
    margin-top: 24px;
    padding: 16px;
    background: transparent;
    border: 1px solid #00ff41;
    border-radius: 3px;
    color: #00ff41;
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: all 0.2s;
  }

  .btn::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(0,255,65,0.15), transparent);
    transition: left 0.4s;
  }

  .btn:hover::before { left: 100%; }
  .btn:hover {
    background: rgba(0, 255, 65, 0.1);
    box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
    text-shadow: 0 0 8px rgba(0, 255, 65, 0.8);
  }

  .btn:active { transform: scale(0.98); }

  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .btn-text { position: relative; z-index: 1; }

  /* Auth success indicator */
  .auth-badge {
    display: none;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: #00ff41;
    letter-spacing: 1px;
    margin-bottom: 16px;
    padding: 8px 12px;
    border: 1px solid rgba(0, 255, 65, 0.3);
    border-radius: 3px;
    background: rgba(0, 255, 65, 0.05);
  }

  .auth-badge.show { display: flex; }

  .auth-badge-dot {
    width: 6px;
    height: 6px;
    background: #00ff41;
    border-radius: 50%;
    box-shadow: 0 0 6px #00ff41;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 6px #00ff41; }
    50% { opacity: 0.5; box-shadow: 0 0 2px #00ff41; }
  }

  .status-line {
    margin-top: 20px;
    font-size: 11px;
    color: #005c1a;
    letter-spacing: 1px;
    min-height: 16px;
    text-align: center;
  }

  .status-line.active { color: #00ff41; }
  .status-line.error  { color: #ff3131; }

  .blink {
    animation: blink 1s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* Step screens */
  #stepAuth  { display: block; }
  #stepSend  { display: none; }

  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .modal-overlay.show { display: flex; }

  .modal {
    width: 100%;
    max-width: 320px;
    border: 1px solid rgba(0, 255, 65, 0.5);
    border-radius: 4px;
    background: #000;
    padding: 32px 24px;
    text-align: center;
    position: relative;
    box-shadow: 0 0 40px rgba(0, 255, 65, 0.2);
  }

  .modal .corner { opacity: 1; }

  .modal-icon {
    font-size: 36px;
    margin-bottom: 16px;
    filter: drop-shadow(0 0 10px rgba(0,255,65,0.8));
  }

  .modal-title {
    font-family: 'Orbitron', monospace;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #00ff41;
    margin-bottom: 10px;
    text-shadow: 0 0 10px rgba(0,255,65,0.5);
  }

  .modal-body {
    font-size: 12px;
    color: #008f24;
    letter-spacing: 1px;
    line-height: 1.8;
    margin-bottom: 24px;
    word-break: break-all;
  }

  .modal-body span {
    color: #00ff41;
    display: block;
    margin-top: 4px;
  }

  .modal-btn {
    padding: 12px 32px;
    background: transparent;
    border: 1px solid #00ff41;
    border-radius: 3px;
    color: #00ff41;
    font-family: 'Orbitron', monospace;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .modal-btn:hover {
    background: rgba(0,255,65,0.1);
    box-shadow: 0 0 12px rgba(0,255,65,0.3);
  }

  .footer {
    margin-top: 32px;
    text-align: center;
    font-size: 10px;
    color: #003d0f;
    letter-spacing: 2px;
  }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="title">SENDING E-MAIL</div>
    <div class="subtitle">SECURE TRANSMISSION SYSTEM</div>
    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-dot"></div>
      <div class="divider-line"></div>
    </div>
  </div>

  <div class="card">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <!-- STEP 1: 비번 인증 -->
    <div id="stepAuth">
      <div class="label">ACCESS CODE</div>
      <input type="password" id="pwInput" placeholder="••••••••••••••••" autocomplete="off" />
      <div class="error-msg" id="pwError">// ACCESS DENIED</div>

      <button class="btn" id="authBtn" onclick="doAuth()">
        <span class="btn-text">AUTHENTICATE</span>
      </button>

      <div class="status-line" id="authStatus">// ENTER ACCESS CODE<span class="blink">_</span></div>
    </div>

    <!-- STEP 2: 이메일 전송 -->
    <div id="stepSend">
      <div class="auth-badge show">
        <div class="auth-badge-dot"></div>
        <span>SESSION AUTHENTICATED</span>
      </div>

      <div class="label">TARGET ADDRESS</div>
      <input type="email" id="emailInput" placeholder="user@domain.com" autocomplete="email" />
      <div class="error-msg" id="emailError">// INVALID EMAIL FORMAT</div>

      <button class="btn" id="sendBtn" onclick="sendEmail()">
        <span class="btn-text">TRANSMIT</span>
      </button>

      <div class="status-line" id="sendStatus">// AWAITING INPUT<span class="blink">_</span></div>
    </div>
  </div>

  <div class="footer">[ ENCRYPTED · SECURE · PRIVATE ]</div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
    <div class="modal-icon">✓</div>
    <div class="modal-title">TRANSMISSION COMPLETE</div>
    <div class="modal-body">
      이메일 발송 완료
      <span id="modalEmail"></span>
    </div>
    <button class="modal-btn" onclick="closeModal()">CONFIRM</button>
  </div>
</div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbxH4-SopczisKZKzbCf0WqWhtAMOqgNC7z9ougf1hhunibW4OIX9A1IUpes5rfxk7O0ew/exec";

let sessionToken = null;
let sessionTs    = null;

// ── 저장된 세션 복원 (영구 인증) ────────────────────────
(function restoreSession() {
  try {
    const saved = localStorage.getItem('togo_session');
    if (!saved) return;
    const s = JSON.parse(saved);
    if (s.token && s.ts) {
      sessionToken = s.token;
      sessionTs    = s.ts;
      document.getElementById('stepAuth').style.display = 'none';
      document.getElementById('stepSend').style.display = 'block';
    }
  } catch(e) {
    localStorage.removeItem('togo_session');
  }
})();

// ── 뒤로가기 처리 ──────────────────────────────────────
history.pushState(null, '', location.href);
window.addEventListener('popstate', function() {
  if (document.getElementById('modalOverlay').classList.contains('show')) {
    closeModal();
    history.pushState(null, '', location.href);
  }
});

// ── STEP 1: 인증 ────────────────────────────────────────
async function doAuth() {
  const pw      = document.getElementById('pwInput').value;
  const pwError = document.getElementById('pwError');
  const status  = document.getElementById('authStatus');
  const btn     = document.getElementById('authBtn');

  pwError.classList.remove('show');
  if (!pw) { pwError.classList.add('show'); return; }

  btn.disabled = true;
  status.className = 'status-line active';
  status.innerHTML = '// AUTHENTICATING<span class="blink">_</span>';

  try {
    const res  = await fetch(GAS_URL + '?action=auth&pw=' + encodeURIComponent(pw));
    const data = await res.json();

    if (data.ok) {
      sessionToken = data.token;
      sessionTs    = data.ts;

      // 영구 저장
      localStorage.setItem('togo_session', JSON.stringify({ token: data.token, ts: data.ts }));

      // 화면 전환
      document.getElementById('stepAuth').style.display = 'none';
      document.getElementById('stepSend').style.display = 'block';
      document.getElementById('emailInput').focus();
    } else {
      pwError.classList.add('show');
      status.className = 'status-line error';
      status.innerHTML = '// ACCESS DENIED<span class="blink">_</span>';
      document.getElementById('pwInput').value = '';
      document.getElementById('pwInput').focus();
    }
  } catch (err) {
    status.className = 'status-line error';
    status.innerHTML = '// CONNECTION ERROR<span class="blink">_</span>';
  }

  btn.disabled = false;
}

// ── STEP 2: 이메일 전송 ─────────────────────────────────
async function sendEmail() {
  const input      = document.getElementById('emailInput');
  const email      = input.value.trim();
  const emailError = document.getElementById('emailError');
  const status     = document.getElementById('sendStatus');
  const btn        = document.getElementById('sendBtn');

  emailError.classList.remove('show');

  const emailRegex = /^[\w.-]+@[\w.-]+\.\w+$/;
  if (!emailRegex.test(email)) {
    emailError.classList.add('show');
    input.focus();
    return;
  }

  if (!sessionToken) {
    // 토큰 없으면 인증 화면으로 복귀
    document.getElementById('stepSend').style.display = 'none';
    document.getElementById('stepAuth').style.display = 'block';
    return;
  }

  btn.disabled = true;
  status.className = 'status-line active';
  status.innerHTML = '// TRANSMITTING<span class="blink">_</span>';

  try {
    const params = new URLSearchParams({
      action : 'send',
      email  : email,
      token  : sessionToken,
      ts     : sessionTs
    });
    const res  = await fetch(GAS_URL + '?' + params.toString());
    const data = await res.json();

    if (data.ok) {
      status.className = 'status-line';
      status.innerHTML = '// AWAITING INPUT<span class="blink">_</span>';
      document.getElementById('modalEmail').textContent = email;
      document.getElementById('modalOverlay').classList.add('show');
      input.value = '';
    } else if (data.err === 'INVALID_TOKEN' || data.err === 'EXPIRED') {
      // 토큰 만료 → 재인증
      sessionToken = null;
      sessionTs    = null;
      localStorage.removeItem('togo_session');
      status.className = 'status-line error';
      status.innerHTML = '// SESSION EXPIRED — RE-AUTH<span class="blink">_</span>';
      setTimeout(() => {
        document.getElementById('stepSend').style.display = 'none';
        document.getElementById('stepAuth').style.display = 'block';
        document.getElementById('authStatus').className = 'status-line';
        document.getElementById('authStatus').innerHTML = '// ENTER ACCESS CODE<span class="blink">_</span>';
      }, 1500);
    } else {
      status.className = 'status-line error';
      status.innerHTML = '// ERROR: RETRY<span class="blink">_</span>';
    }
  } catch (err) {
    status.className = 'status-line error';
    status.innerHTML = '// CONNECTION ERROR<span class="blink">_</span>';
  }

  btn.disabled = false;
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

// ── 키보드 단축키 ───────────────────────────────────────
document.getElementById('pwInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') doAuth();
});

document.getElementById('pwInput').addEventListener('input', () => {
  document.getElementById('pwError').classList.remove('show');
});

document.addEventListener('keydown', e => {
  const sendStep = document.getElementById('stepSend');
  if (sendStep.style.display === 'block' && e.key === 'Enter') sendEmail();
});

document.getElementById('emailInput').addEventListener('input', () => {
  document.getElementById('emailError').classList.remove('show');
});
</script>
</body>
</html>
